[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "andromeda-api"
version = "0.1.0"
description = "Read-only FastAPI v1 for active Andromeda academic data releases"
requires-python = ">=3.11"
dependencies = [
  "andromeda-academic-data-db",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
