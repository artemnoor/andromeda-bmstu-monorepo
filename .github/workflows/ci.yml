name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked Ruff tool
        run: |
          python -m pip install uv==0.11.28
          uv sync --locked --group dev --no-install-workspace
      - name: Check repository lint
        run: uv run --no-sync ruff check .

  changes:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.filter.outputs.db }}
      domain_contracts: ${{ steps.filter.outputs.domain_contracts }}
      api_ingestion: ${{ steps.filter.outputs.api_ingestion }}
      directus: ${{ steps.filter.outputs.directus }}
      web: ${{ steps.filter.outputs.web }}
      web_react_poc: ${{ steps.filter.outputs.web_react_poc }}
      unclassified: ${{ steps.filter.outputs.unclassified }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # On a push, compare only the commits in that push. Pull requests are
          # compared with their base branch by paths-filter.
          base: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.ref }}
          predicate-quantifier: 'some-with-excludes'
          filters: |
            db:
              - 'packages/db/**'
              - 'infra/database/**'
              - 'domain/**'
              - 'tests/**'
              - 'tests/fixtures/**'
              - 'data/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Makefile'
              - '.env.example'
              - 'docker-compose.yml'
              - '.github/workflows/**'
            domain_contracts:
              - 'domain/**'
              - 'packages/release-bundles/**'
              - 'packages/contracts/**'
              - 'packages/db/**'
              - 'services/api/**'
              - 'services/ingestion/**'
              - 'services/ingestion-cli/**'
              - 'tests/**'
              - 'tests/fixtures/**'
              - 'data/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Makefile'
              - '.env.example'
              - 'packages/db/migrations/**'
              - 'docker-compose.yml'
              - '.github/workflows/**'
            api_ingestion:
              - 'services/api/**'
              - 'services/ingestion/**'
              - 'services/ingestion-cli/**'
              - 'packages/release-bundles/**'
              - 'domain/**'
              - 'packages/contracts/**'
              - 'packages/db/**'
              - 'tests/**'
              - 'tests/integration/**'
              - 'tests/fixtures/**'
              - 'data/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Makefile'
              - '.env.example'
              - 'packages/db/migrations/**'
              - 'docker-compose.yml'
              - '.github/workflows/**'
            directus:
              - 'platform/directus/**'
              - 'services/api/**'
              - 'packages/db/**'
              - 'domain/**'
              - 'tests/**'
              - 'tests/fixtures/**'
              - 'data/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Makefile'
              - '.env.example'
              - 'packages/db/migrations/**'
              - 'docker-compose.yml'
              - '.github/workflows/**'
            web:
              - 'apps/web/**'
              - 'Makefile'
              - 'README.md'
              - '.github/workflows/**'
            web_react_poc:
              - 'apps/web-react-poc/**'
              - 'services/api/**'
              - 'packages/contracts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'
            unclassified:
              - '**'
              - '!packages/db/**'
              - '!packages/release-bundles/**'
              - '!packages/contracts/**'
              - '!infra/database/**'
              - '!domain/**'
              - '!services/api/**'
              - '!services/ingestion/**'
              - '!services/ingestion-cli/**'
              - '!platform/directus/**'
              - '!apps/web/**'
              - '!apps/web-react-poc/**'
              - '!docker-compose.yml'
              - '!tests/**'
              - '!data/**'
              - '!pyproject.toml'
              - '!uv.lock'
              - '!Makefile'
              - '!.env.example'
              - '!.github/workflows/**'

  db-check:
    if: needs.changes.result == 'success' && needs.changes.outputs.db == 'true' && github.ref != 'refs/heads/main'
    needs: changes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: academic_data_test
          POSTGRES_USER: andromeda_test
          POSTGRES_PASSWORD: andromeda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U andromeda_test -d academic_data_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      ACADEMIC_DATA_ENV: test
      ACADEMIC_DATA_DATABASE_URL: postgresql+psycopg://andromeda_test:andromeda_test@localhost:5432/academic_data_test
      UV_NO_EDITABLE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Create local env file for Make targets
        run: cp .env.example .env
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poppler for curriculum PDF parsing
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils postgresql-client
          pdftotext -v
      - name: Install locked workspace
        run: |
          python -m pip install uv==0.11.28
          uv sync --locked --all-packages --group dev --no-editable
      - name: Upgrade and check the isolated PostgreSQL database
        run: |
          make migrate
          uv run academic-data db check
      - name: Run database migration and lifecycle tests
        run: uv run pytest -q tests/integration/test_db_migrations.py tests/integration/test_postgres_import.py tests/integration/test_proposals_postgres.py
      - name: Verify isolated PostgreSQL backup and restore
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $backupDirectory = Join-Path $env:RUNNER_TEMP "andromeda-backup-check"
          New-Item -ItemType Directory -Force -Path $backupDirectory | Out-Null
          $backupPath = Join-Path $backupDirectory "academic-data-test.dump"
          try {
            & ./infra/database/backup.ps1 -Target test -OutputPath $backupPath
            & ./infra/database/restore-check.ps1 -Target test -BackupPath $backupPath
          }
          finally {
            if (Test-Path -LiteralPath $backupPath) {
              Remove-Item -LiteralPath $backupPath -Force
            }
          }

  domain-contracts-check:
    if: needs.changes.result == 'success' && needs.changes.outputs.domain_contracts == 'true' && github.ref != 'refs/heads/main'
    needs: changes
    runs-on: ubuntu-latest
    env:
      UV_NO_EDITABLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked workspace
        run: |
          python -m pip install uv==0.11.28
          uv sync --locked --all-packages --group dev --no-editable
      - name: Run domain, API contract, proposal, and import boundary tests
        run: >-
          uv run pytest -q
          tests/test_domain_semantics.py
          tests/test_import_boundaries.py
          services/api/tests/test_api_contracts.py
          services/api/tests/test_proposals.py
          services/api/tests/test_proposal_publication_binding.py

  api-ingestion-check:
    if: needs.changes.result == 'success' && needs.changes.outputs.api_ingestion == 'true' && github.ref != 'refs/heads/main'
    needs: changes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: academic_data_test
          POSTGRES_USER: andromeda_test
          POSTGRES_PASSWORD: andromeda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U andromeda_test -d academic_data_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      ACADEMIC_DATA_ENV: test
      ACADEMIC_DATA_DATABASE_URL: postgresql+psycopg://andromeda_test:andromeda_test@localhost:5432/academic_data_test
      UV_NO_EDITABLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poppler for curriculum PDF fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - name: Install locked workspace
        run: |
          python -m pip install uv==0.11.28
          uv sync --locked --all-packages --group dev --no-editable
      - name: Upgrade the isolated PostgreSQL database
        run: uv run academic-data db upgrade
      - name: Run API, ingestion, and publication regression tests
        run: >-
          uv run pytest -q
          services/api/tests/test_api_contracts.py
          tests/test_offline_bundle.py
          tests/test_ingestion_cli_composition.py
          tests/test_bmstu_parser_cli.py
          tests/test_bmstu_ingestion.py
          tests/test_curriculum_identity.py
          tests/integration/test_postgres_import.py
          tests/integration/test_proposals_postgres.py

  directus-check:
    if: needs.changes.result == 'success' && needs.changes.outputs.directus == 'true' && github.ref != 'refs/heads/main'
    needs: changes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: academic_data_test
          POSTGRES_USER: andromeda_test
          POSTGRES_PASSWORD: andromeda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U andromeda_test -d academic_data_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      ACADEMIC_DATA_ENV: test
      ACADEMIC_DATA_DATABASE_URL: postgresql+psycopg://andromeda_test:andromeda_test@localhost:5432/academic_data_test
      UV_NO_EDITABLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked workspace
        run: |
          python -m pip install uv==0.11.28
          uv sync --locked --all-packages --group dev --no-editable
      - name: Upgrade the isolated PostgreSQL database
        run: uv run academic-data db upgrade
      - name: Run Directus metadata and permission tests
        run: uv run pytest -q tests/test_directus_metadata.py tests/integration/test_directus_permissions.py tests/integration/test_directus_runtime.py

  web-check:
    if: needs.changes.result == 'success' && needs.changes.outputs.web == 'true' && github.ref != 'refs/heads/main'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run applicant web tests and production build
        run: make web-check

  web-react-poc-check:
    if: needs.changes.result == 'success' && needs.changes.outputs.web_react_poc == 'true' && github.ref != 'refs/heads/main'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-react-poc/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked workspace for OpenAPI generation
        run: |
          python -m pip install uv==0.11.28
          uv sync --locked --all-packages --group dev --no-editable
      - name: Install locked React POC dependencies
        run: npm ci --prefix apps/web-react-poc
      - name: Check generated FastAPI client contract
        run: npm --prefix apps/web-react-poc run api:check
      - name: Typecheck, lint, test, and build the isolated React POC
        run: |
          npm --prefix apps/web-react-poc run typecheck
          npm --prefix apps/web-react-poc run lint
          npm --prefix apps/web-react-poc test
          npm --prefix apps/web-react-poc run build

  web-browser-check:
    # Keep one browser/API integration status on every PR, independent of the
    # selective backend jobs above. The database and credentials are disposable.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: academic_data_test
          POSTGRES_USER: andromeda_test
          POSTGRES_PASSWORD: andromeda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U andromeda_test -d academic_data_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      ACADEMIC_DATA_ENV: test
      ACADEMIC_DATA_DATABASE_URL: postgresql+psycopg://andromeda_test:andromeda_test@localhost:5432/academic_data_test
      UV_NO_EDITABLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/web-react-poc/package-lock.json
      - name: Install locked web dependencies
        run: npm ci --prefix apps/web
      - name: Install locked React POC dependencies
        run: npm ci --prefix apps/web-react-poc
      - name: Run web unit tests and production build
        run: |
          npm --prefix apps/web test
          npm --prefix apps/web run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked workspace
        run: |
          python -m pip install uv==0.11.28
          uv sync --locked --all-packages --group dev --no-editable
      - name: Migrate and seed the isolated PostgreSQL database
        run: |
          uv run academic-data db upgrade
          uv run academic-data bundle import --input data/bmstu-2026 --commit
      - name: Install PostgreSQL client for runtime role setup
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Provision the disposable read-only API login
        run: |
          PGPASSWORD=andromeda_test psql \
            --host localhost \
            --username andromeda_test \
            --dbname academic_data_test \
            --set ON_ERROR_STOP=1 \
            --command "ALTER ROLE andromeda_api_runtime WITH LOGIN PASSWORD 'andromeda-ci-runtime';"
      - name: Start FastAPI and wait for an active release
        run: |
          ACADEMIC_DATA_ENV=test \
          ACADEMIC_DATA_DATABASE_URL='postgresql+psycopg://andromeda_api_runtime:andromeda-ci-runtime@localhost:5432/academic_data_test' \
            uv run --package andromeda-api uvicorn andromeda_api.main:app \
              --host 127.0.0.1 --port 8000 \
              > "$RUNNER_TEMP/andromeda-api.log" 2>&1 &

          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health \
              --output "$RUNNER_TEMP/andromeda-api-health.json"; then
              cat "$RUNNER_TEMP/andromeda-api-health.json"
              exit 0
            fi
            sleep 2
          done

          cat "$RUNNER_TEMP/andromeda-api.log"
          exit 1
      - name: Install Playwright browsers and system dependencies
        working-directory: apps/web
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser tests against the live API
        env:
          API_ORIGIN: http://127.0.0.1:8000
          CI: 'true'
          PLAYWRIGHT_BROWSERS: chromium,firefox,webkit
          PLAYWRIGHT_LIVE_API: '1'
        run: npm --prefix apps/web run test:e2e
      - name: Install React POC Playwright browsers
        run: npm --prefix apps/web-react-poc exec -- playwright install --with-deps chromium firefox webkit
      - name: Run React POC browser tests against the same PostgreSQL 16 API
        env:
          API_PROXY_TARGET: http://127.0.0.1:8000
          CI: 'true'
        run: npm --prefix apps/web-react-poc run test:e2e
      - name: Build React POC for production-server comparison
        run: npm --prefix apps/web-react-poc run build
      - name: Compare original and React screens and collect repeated performance samples
        env:
          API_ORIGIN: http://127.0.0.1:8000
          API_PROXY_TARGET: http://127.0.0.1:8000
          BENCHMARK_ITERATIONS: '5'
          CI: 'true'
        run: npm --prefix apps/web-react-poc run test:paired
      - name: Upload Playwright reports, screenshots, and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-failure
          path: |
            artifacts/qa-stabilization/playwright-report/
            artifacts/qa-stabilization/playwright-results/
            apps/web-react-poc/playwright-report/
            apps/web-react-poc/test-results/e2e/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload React visual and performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-poc-visual-performance-${{ github.run_id }}
          path: |
            apps/web-react-poc/playwright-report/paired/
            apps/web-react-poc/test-results/paired-visual-performance/
          if-no-files-found: ignore
          retention-days: 7

  full-check:
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       github.ref == 'refs/heads/main' ||
       needs.changes.result != 'success' ||
       needs.changes.outputs.unclassified == 'true' ||
       (needs.changes.outputs.db != 'true' &&
        needs.changes.outputs.domain_contracts != 'true' &&
        needs.changes.outputs.api_ingestion != 'true' &&
        needs.changes.outputs.directus != 'true'))
    needs: changes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: academic_data_test
          POSTGRES_USER: andromeda_test
          POSTGRES_PASSWORD: andromeda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U andromeda_test -d academic_data_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      ACADEMIC_DATA_ENV: test
      ACADEMIC_DATA_DATABASE_URL: postgresql+psycopg://andromeda_test:andromeda_test@localhost:5432/academic_data_test
      UV_NO_EDITABLE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Create local env file for Make targets
        run: cp .env.example .env
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poppler for curriculum PDF tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils postgresql-client
          pdftotext -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run applicant web tests and production build
        run: make web-check
      - name: Install locked workspace
        run: |
          python -m pip install uv==0.11.28
          uv sync --locked --all-packages --group dev --no-editable
      - name: Validate and dry-run the checked-in bundle
        run: |
          uv run academic-data bundle validate --input data/bmstu-2026
          uv run academic-data bundle import --input data/bmstu-2026 --dry-run
      - name: Check the active parser set
        run: uv run andromeda-bmstu list
      - name: Upgrade and check the isolated PostgreSQL database
        run: |
          make migrate
          uv run academic-data db check
      - name: Validate documented local commands and Compose
        run: make validate
      - name: Run the full test suite
        run: make test
      - name: Verify isolated PostgreSQL backup and restore
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $backupDirectory = Join-Path $env:RUNNER_TEMP "andromeda-backup-check"
          New-Item -ItemType Directory -Force -Path $backupDirectory | Out-Null
          $backupPath = Join-Path $backupDirectory "academic-data-test.dump"
          try {
            & ./infra/database/backup.ps1 -Target test -OutputPath $backupPath
            & ./infra/database/restore-check.ps1 -Target test -BackupPath $backupPath
          }
          finally {
            if (Test-Path -LiteralPath $backupPath) {
              Remove-Item -LiteralPath $backupPath -Force
            }
          }
