    function renderWorkloadChart(programs, stats) {
      const section = document.createElement("section");
      section.className = "compare-section";
      const heading = document.createElement("div");
      heading.className = "section-heading";
      const copy = document.createElement("div");
      addText(copy, "p", "section-kicker", "Нагрузка");
      addText(copy, "h2", "", "По семестрам");
      addText(copy, "p", "", "Общие горизонтальные шкалы помогают сравнить нагрузку в одном и том же семестре.");
      heading.append(copy);
      section.append(heading);
      const semesters = sortSemesters(new Set(stats.flatMap((map) => [...map.keys()])));

      const panel = document.createElement("div");
      panel.className = "workload-panel";
      const panelHead = document.createElement("div");
      panelHead.className = "workload-panel-head";
      const description = document.createElement("div");
      addText(description, "strong", "", "Выбери единицу измерения");
      addText(description, "p", "", "Учитываются дисциплины с числовым значением; справа показана точная сумма.");
      const switcher = document.createElement("div");
      switcher.className = "workload-switch";
      switcher.setAttribute("role", "group");
      switcher.setAttribute("aria-label", "Единица нагрузки");
      const controls = [];
      for (const option of [{ key: "credits", label: "Зачётные единицы" }, { key: "hours", label: "Часы" }]) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = option.label;
        button.setAttribute("aria-pressed", String(selectedMetric.key === option.key));
        button.dataset.metric = option.key;
        button.addEventListener("click", () => {
          selectedMetric.key = option.key;
          controls.forEach((control) => control.setAttribute("aria-pressed", String(control.dataset.metric === selectedMetric.key)));
          updateChart();
        });
        controls.push(button);
        switcher.append(button);
      }
      panelHead.append(description, switcher);
      panel.append(panelHead);

      const legend = document.createElement("div");
      legend.className = "workload-legend";
      programs.forEach((program, index) => {
        const item = document.createElement("span");
        item.className = "workload-legend-item";
        item.style.setProperty("--series-color", SERIES_COLORS[index]);
        const dot = document.createElement("span");
        dot.className = "workload-dot";
        dot.setAttribute("aria-hidden", "true");
        const label = document.createElement("strong");
        label.textContent = program.code || program.name;
        item.append(dot, label);
        legend.append(item);
      });
      panel.append(legend);
      const chart = document.createElement("div");
      chart.className = "workload-chart";
      chart.setAttribute("role", "group");
      chart.setAttribute("aria-label", "Сравнение нагрузки по семестрам");
      panel.append(chart);
      const details = document.createElement("details");
      details.className = "workload-details";
      addText(details, "summary", "", "Показать сравнение по " + semesters.length + " семестрам");
      details.append(panel);
      section.append(details);

      function updateChart() {
        chart.replaceChildren();
        if (!semesters.length) {
          addText(chart, "p", "workload-empty", "В выбранных программах нет данных о семестрах.");
          return;
        }
        const metricKey = selectedMetric.key;
        const countKey = metricKey + "Count";
        const unit = metricKey === "credits" ? "з.е." : "ч.";
        const maximum = Math.max(0, ...stats.flatMap((map) => semesters.map((term) => map.get(term)?.[metricKey] || 0)));
        for (const term of semesters) {
          const row = document.createElement("div");
          row.className = "workload-row";
          addText(row, "strong", "workload-term", term === "unknown" ? "Семестр не указан" : term + " семестр");
          const seriesGrid = document.createElement("div");
          seriesGrid.className = "workload-series-grid";
          seriesGrid.style.setProperty("--series-count", programs.length);
          programs.forEach((program, index) => {
            const metric = stats[index].get(term);
            const count = metric?.[countKey] || 0;
            const value = count ? metric[metricKey] : null;
            const series = document.createElement("div");
            series.className = "workload-series";
            series.style.setProperty("--series-color", SERIES_COLORS[index]);
            series.setAttribute("role", "group");
            series.setAttribute("aria-label", (program.code || program.name) + ": " + (value === null ? "нет числовых данных" : Andromeda.formatNumber(value, metricKey === "credits" ? 1 : 0) + " " + unit));
            addText(series, "span", "workload-code", program.code || program.name);
            if (value === null) {
              addText(series, "span", "workload-empty-value", "Нет данных");
            } else {
              const track = document.createElement("span");
              track.className = "workload-track";
              track.setAttribute("aria-hidden", "true");
              const fill = document.createElement("span");
              fill.className = "workload-fill";
              const width = maximum ? Math.max(3, (value / maximum) * 100) : 0;
              fill.style.setProperty("--bar-width", Math.min(100, width) + "%");
              track.append(fill);
              series.append(track);
              addText(series, "span", "workload-value", Andromeda.formatNumber(value, metricKey === "credits" ? 1 : 0) + " " + unit);
            }
            seriesGrid.append(series);
          });
          row.append(seriesGrid);
          chart.append(row);
        }
        addText(chart, "p", "matrix-footnote", "Длина полосы показывает сумму относительно максимума в выбранных программах и семестрах.");
      }
      updateChart();
      return section;
    }

    function renderCategoryTable(programs, curriculumMap, plansByProgram, taxonomyCategories) {
      const section = document.createElement("section");
      section.className = "compare-section";
      const summaries = programs.map((program) => {
        const rows = curriculumMap.get(programKey(program)) || [];
        const groups = new Map();
        for (const item of rows) {
          const classification = Andromeda.getSubjectClassification(item);
          const key = classification
            ? classification.code ? "code:" + classification.code : "name:" + classification.name.toLocaleLowerCase("ru-RU")
            : UNCLASSIFIED_CATEGORY_KEY;
          const name = classification?.name || "Категория не указана";
          if (!groups.has(key)) groups.set(key, { key, name, code: classification?.code || "", items: [], hours: 0, hoursCount: 0 });
          const group = groups.get(key);
          group.items.push(item);
          const hours = numberOrNull(item.hours);
          if (hours !== null) { group.hours += hours; group.hoursCount += 1; }
        }
        return { program, rows, groups, hours: sumMetric(rows, "hours"), plan: plansByProgram.get(programKey(program)) };
      });

      const categoryMeta = new Map();
      for (const category of taxonomyCategories || []) {
        const code = Andromeda.text(category.category_code || category.code);
        const name = Andromeda.text(category.name || category.category_name);
        if (!code || !name) continue;
        const key = "code:" + code;
        if (!categoryMeta.has(key)) categoryMeta.set(key, { key, name, code });
      }
      for (const summary of summaries) {
        for (const [key, group] of summary.groups) {
          if (!categoryMeta.has(key)) categoryMeta.set(key, { key, name: group.name, code: group.code });
        }
      }
      const categoryColorMap = new Map();
      [...categoryMeta.values()]
        .filter((category) => category.key !== UNCLASSIFIED_CATEGORY_KEY)
        .sort((a, b) => (Number(a.code) || 0) - (Number(b.code) || 0) || a.name.localeCompare(b.name, "ru"))
        .forEach((category, index) => categoryColorMap.set(category.key, CATEGORY_COLORS[index % CATEGORY_COLORS.length]));
      const categoryColor = (key) => key === UNCLASSIFIED_CATEGORY_KEY ? "#b9c3cf" : categoryColorMap.get(key) || CATEGORY_COLORS[0];
      for (const category of categoryMeta.values()) category.color = categoryColor(category.key);

      const metricValue = (_summary, items) => sumMetric(items, "hours").value;
      const metricCount = (_summary, items) => sumMetric(items, "hours").count;
      const formatMetric = (value) => Andromeda.formatNumber(value) + " ч.";
      const percent = (value, total, hasData = true) => {
        if (!hasData || !total) return "—";
        if (!value) return "0%";
        const rounded = Math.round(value / total * 100);
        return rounded < 1 ? "<1%" : rounded + "%";
      };
      const totalFor = (summary) => summary.hours.value;
      const hasTotalFor = (summary) => summary.hours.count > 0;
      const aggregateFor = (key) => summaries.reduce((sum, summary) => {
        const group = summary.groups.get(key);
        if (!group) return sum;
        return sum + group.hours;
      }, 0);
      const allKeys = [...categoryMeta.keys()];
      const visibleCategories = [...categoryMeta.values()]
        .filter((category) => category.key !== UNCLASSIFIED_CATEGORY_KEY)
        .sort((a, b) => (Number(a.code) || 0) - (Number(b.code) || 0) || a.name.localeCompare(b.name, "ru"));
      if (categoryMeta.has(UNCLASSIFIED_CATEGORY_KEY)) visibleCategories.push(categoryMeta.get(UNCLASSIFIED_CATEGORY_KEY));
      const visibleKeys = visibleCategories.map((category) => category.key);
      const defaultCategory = visibleCategories.slice().sort((a, b) => aggregateFor(b.key) - aggregateFor(a.key))
        .find((category) => category.key !== UNCLASSIFIED_CATEGORY_KEY && aggregateFor(category.key) > 0)
        || visibleCategories[0]
        || null;
      if (!visibleKeys.includes(activeCategoryKey)) activeCategoryKey = defaultCategory?.key || null;

      const itemsFor = (summary, key) => summary.groups.get(key)?.items || [];
      const categoryValueFor = (summary, key) => metricValue(summary, itemsFor(summary, key));
      const categoryHasMetric = (summary, key) => metricCount(summary, itemsFor(summary, key)) > 0
        || (!itemsFor(summary, key).length && hasTotalFor(summary));
      const hoursTotal = summaries.reduce((sum, summary) => sum + summary.hours.value, 0);
      const combinedHasData = summaries.some((summary) => summary.hours.count > 0);

      const board = document.createElement("div");
      board.className = "category-comparison-board";
      const boardHead = document.createElement("header");
      boardHead.className = "category-board-head";
      const lead = document.createElement("div");
      addText(lead, "p", "section-kicker", "Структура учебных планов");
      addText(lead, "h2", "category-board-title", "Куда уходит учебное время");
      const taxonomyCategoryCount = visibleCategories.filter((category) => category.key !== UNCLASSIFIED_CATEGORY_KEY).length;
      addText(lead, "p", "category-board-copy", "Сектора показывают долю учебных часов в каждой предметной категории.");
      addText(lead, "span", "category-count-tag", "В классификаторе: " + Andromeda.formatNumber(taxonomyCategoryCount) + " категорий");
      boardHead.append(lead);
      const boardTotal = document.createElement("div");
      boardTotal.className = "category-board-total";
      const combinedValue = addText(boardTotal, "strong", "", combinedHasData ? formatMetric(hoursTotal) : "—");
      combinedValue.setAttribute("aria-live", "polite");
      addText(boardTotal, "span", "", "суммарно по выбранным программам");
      boardHead.append(boardTotal);
      board.append(boardHead);

      const programGrid = document.createElement("div");
      programGrid.className = "category-program-grid";
      const programViews = [];
      summaries.forEach((summary, programIndex) => {
        const program = summary.program;
        const plan = plansByProgram.get(programKey(program));
        const card = document.createElement("article");
        card.className = "category-program-card";
        card.style.setProperty("--program-color", SERIES_COLORS[programIndex % SERIES_COLORS.length]);
        const cardHead = document.createElement("header");
        cardHead.className = "category-program-head";
        const identity = document.createElement("div");
        identity.className = "category-program-copy";
        addText(identity, "span", "category-program-code", program.code || "Код не указан");
        addText(identity, "h3", "category-program-name", program.name || "Название не указано");
        cardHead.append(identity);
        const totalBox = document.createElement("div");
        totalBox.className = "category-program-total";
        const shownTotal = hasTotalFor(summary) ? formatMetric(totalFor(summary)) : "—";
        addText(totalBox, "strong", "", shownTotal);
        const programCategoryCount = visibleCategories.filter((category) => category.key !== UNCLASSIFIED_CATEGORY_KEY && itemsFor(summary, category.key).length > 0).length;
        const totalNote = summary.rows.length
          ? programCategoryCount + "/" + taxonomyCategoryCount + " категорий в плане"
          : plan?.status === "unverified" ? "связь плана не подтверждена"
            : plan?.status === "unavailable" ? "план пока недоступен" : "нет дисциплин в данных";
        addText(totalBox, "span", "", totalNote);
        cardHead.append(totalBox);
        card.append(cardHead);

        const chartLayout = document.createElement("div");
        chartLayout.className = "category-chart-layout";
        const donutWrap = document.createElement("div");
        donutWrap.className = "category-interactive-donut-wrap";
        const donut = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        donut.classList.add("category-interactive-donut");
        donut.setAttribute("viewBox", "0 0 220 220");
        donut.setAttribute("role", "group");
        donut.setAttribute("aria-label", "Распределение программы " + (program.code || program.name) + " по категориям");
        const circumference = 2 * Math.PI * 75;
        const track = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        track.classList.add("category-donut-track");
        track.setAttribute("cx", "110");
        track.setAttribute("cy", "110");
        track.setAttribute("r", "75");
        donut.append(track);
        let offset = 0;
        for (const category of visibleCategories) {
          const value = categoryValueFor(summary, category.key);
          if (value <= 0 || !hasTotalFor(summary)) continue;
          const arcLength = circumference * value / totalFor(summary);
          const visibleLength = Math.min(circumference, Math.max(.7, arcLength - .4));
          const arc = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          arc.classList.add("category-donut-segment");
          arc.dataset.categorySelect = category.key;
          arc.style.setProperty("--category-color", category.color);
          arc.setAttribute("cx", "110");
          arc.setAttribute("cy", "110");
          arc.setAttribute("r", "75");
          arc.setAttribute("stroke-dasharray", visibleLength + " " + (circumference - visibleLength));
          arc.setAttribute("stroke-dashoffset", String(-offset));
          arc.setAttribute("transform", "rotate(-90 110 110)");
          arc.setAttribute("role", "button");
          arc.setAttribute("tabindex", "0");
          arc.setAttribute("aria-label", category.name + ": " + formatMetric(value) + ", " + percent(value, totalFor(summary)));
          arc.setAttribute("aria-pressed", "false");
          arc.addEventListener("click", () => selectCategory(category.key));
          arc.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") { event.preventDefault(); selectCategory(category.key); }
          });
          donut.append(arc);
          offset += arcLength;
        }
        donutWrap.append(donut);
        const center = document.createElement("div");
        center.className = "category-donut-center";
        const centerValue = addText(center, "strong", "", "—");
        const centerLabel = addText(center, "span", "", "Выберите категорию");
        donutWrap.append(center);
        chartLayout.append(donutWrap);

        card.append(chartLayout);
        if (summary.rows.length && summary.hours.count < summary.rows.length) {
          addText(card, "p", "category-program-footnote", "Для части дисциплин часы не указаны. Доли рассчитаны по опубликованным значениям.");
        }
        programGrid.append(card);
        programViews.push({ summary, centerValue, centerLabel });
      });
      board.append(programGrid);

      const shared = document.createElement("section");
      shared.className = "category-shared-section";
      shared.setAttribute("aria-labelledby", "category-shared-title");
      const sharedHead = document.createElement("div");
      sharedHead.className = "category-shared-head";
      const sharedCopy = document.createElement("div");
      addText(sharedCopy, "p", "section-kicker", "Общая легенда");
      addText(sharedCopy, "h3", "category-shared-title", "Одна категория — один цвет");
      addText(sharedCopy, "p", "category-shared-copy", "Нажмите на категорию, чтобы выделить её на всех диаграммах и сравнить дисциплины.");
      sharedHead.append(sharedCopy);
      const reset = document.createElement("button");
      reset.type = "button";
      reset.className = "category-reset";
      reset.textContent = "Сбросить выбор";
      reset.addEventListener("click", () => selectCategory(defaultCategory?.key || null));
      sharedHead.append(reset);
      shared.append(sharedHead);
      const sharedGrid = document.createElement("div");
      sharedGrid.className = "category-shared-grid";
      const sharedButtons = [];
      for (const category of visibleCategories) {
        const item = document.createElement("div");
        item.className = "category-shared-item";
        item.style.setProperty("--category-color", category.color);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "category-shared-select";
        button.dataset.categorySelect = category.key;
        button.setAttribute("aria-pressed", "false");
        const dot = document.createElement("span");
        dot.className = "category-shared-dot";
        dot.setAttribute("aria-hidden", "true");
        addText(button, "span", "category-shared-name", category.name);
        const values = document.createElement("span");
        values.className = "category-shared-values";
        summaries.forEach((summary) => {
          const items = itemsFor(summary, category.key);
          const value = metricValue(summary, items);
          const hasValue = categoryHasMetric(summary, category.key);
          const line = document.createElement("span");
          const code = document.createElement("strong");
          code.textContent = summary.program.code || "Программа";
          line.append(code, document.createTextNode(" · " + (hasValue ? formatMetric(value) : "нет данных") + " · " + percent(value, totalFor(summary), hasValue)));
          values.append(line);
        });
        button.prepend(dot);
        button.append(values);
        button.addEventListener("click", () => selectCategory(category.key));
        sharedButtons.push(button);
        const details = document.createElement("button");
        details.type = "button";
        details.className = "category-details-trigger";
        details.textContent = "Подробнее";
        details.setAttribute("aria-label", "Подробнее о категории «" + category.name + "»");
        details.addEventListener("click", () => {
          selectCategory(category.key);
          openCategoryDetails(category);
        });
        item.append(button, details);
        sharedGrid.append(item);
      }
      shared.append(sharedGrid);
      board.append(shared);

      const distribution = document.createElement("section");
      distribution.className = "category-distribution";
      const distributionHead = document.createElement("div");
      distributionHead.className = "category-distribution-heading";
      const distributionTitle = document.createElement("div");
      addText(distributionTitle, "p", "section-kicker", "Сопоставление долей");
      addText(distributionTitle, "h3", "", "Часы по категориям");
      distributionHead.append(distributionTitle);
      addText(distributionHead, "p", "category-distribution-note", "Все категории классификатора видны в таблице. Доли рассчитаны по опубликованным часам.");
      distribution.append(distributionHead);
      const tableWrap = document.createElement("div");
      tableWrap.className = "category-distribution-wrap";
      const table = document.createElement("table");
      table.className = "data-table category-distribution-table";
      addText(table, "caption", "sr-only", "Сравнение учебных часов по категориям предметов.");
      const head = document.createElement("thead");
      const headRow = document.createElement("tr");
      const categoryHeader = addText(headRow, "th", "", "Категория предмета");
      categoryHeader.scope = "col";
      for (const summary of summaries) {
        const th = document.createElement("th");
        th.scope = "col";
        const programHead = document.createElement("div");
        programHead.className = "category-program-head";
        addText(programHead, "span", "category-program-code", summary.program.code || "Код не указан");
        addText(programHead, "span", "category-program-name", summary.program.name || "Название не указано");
        th.append(programHead);
        headRow.append(th);
      }
      head.append(headRow);
      table.append(head);
      const body = document.createElement("tbody");
      const tableKeys = allKeys.sort((a, b) => aggregateFor(b) - aggregateFor(a) || (categoryMeta.get(a)?.name || "").localeCompare(categoryMeta.get(b)?.name || "", "ru"));
      for (const key of tableKeys) {
        const category = categoryMeta.get(key);
        const row = document.createElement("tr");
        row.dataset.categoryRow = key;
        const rowHead = document.createElement("th");
        rowHead.scope = "row";
        const rowName = document.createElement("span");
        rowName.className = "category-row-name";
        rowName.style.setProperty("--category-color", category.color);
        const dot = document.createElement("span");
        dot.className = "category-row-dot";
        dot.setAttribute("aria-hidden", "true");
        addText(rowName, "span", "", category.name);
        rowName.prepend(dot);
        rowHead.append(rowName);
        row.append(rowHead);
        for (const summary of summaries) {
          const cell = document.createElement("td");
          const group = summary.groups.get(key);
          const items = group?.items || [];
          const value = metricValue(summary, items);
          const count = metricCount(summary, items);
          const total = totalFor(summary);
          if (!summary.rows.length) {
            const plan = plansByProgram.get(programKey(summary.program));
            addText(cell, "span", "category-distribution-empty", missingPlanMessage(plan, "Нет данных о плане"));
          } else if (!hasTotalFor(summary) || (group && !count)) {
            addText(cell, "span", "category-distribution-empty", "Нет данных о часах");
          } else {
            const content = document.createElement("div");
            content.className = "category-distribution-cell";
            const labels = document.createElement("div");
            labels.className = "category-distribution-values";
            addText(labels, "strong", "", formatMetric(value));
            addText(labels, "span", "", percent(value, total));
            const track = document.createElement("span");
            track.className = "category-distribution-track";
            track.setAttribute("aria-hidden", "true");
            const fill = document.createElement("span");
            fill.className = "category-distribution-fill";
            fill.style.setProperty("--category-color", category.color);
            fill.style.setProperty("--bar-width", Math.min(100, total ? value / total * 100 : 0) + "%");
            track.append(fill);
            content.append(labels, track);
            cell.append(content);
          }
          row.append(cell);
        }
        body.append(row);
      }
      if (!tableKeys.length) {
        const row = document.createElement("tr");
        const cell = addText(row, "td", "matrix-no-results", "Категории не указаны в данных выбранных программ.");
        cell.colSpan = programs.length + 1;
        body.append(row);
      }
      table.append(body);
      tableWrap.append(table);
      distribution.append(tableWrap);
      board.append(distribution);
      section.append(board);

      const subjectDialog = document.createElement("dialog");
      subjectDialog.className = "category-subject-dialog";
      subjectDialog.setAttribute("aria-labelledby", "categorySubjectDialogTitle");
      subjectDialog.setAttribute("aria-describedby", "categorySubjectDialogDescription");
      const dialogShell = document.createElement("div");
      dialogShell.className = "category-dialog-shell";
      const dialogHead = document.createElement("header");
      dialogHead.className = "category-dialog-head";
      const dialogHeading = document.createElement("div");
      addText(dialogHeading, "p", "section-kicker", "Состав категории");
      const dialogTitle = addText(dialogHeading, "h2", "category-dialog-title", "Предметы по направлениям");
      dialogTitle.id = "categorySubjectDialogTitle";
      const dialogDescription = addText(dialogHeading, "p", "category-dialog-description", "Все дисциплины этой категории в выбранных учебных планах.");
      dialogDescription.id = "categorySubjectDialogDescription";
      const dialogClose = document.createElement("button");
      dialogClose.type = "button";
      dialogClose.className = "category-dialog-close";
      dialogClose.setAttribute("aria-label", "Закрыть подробности категории");
      dialogClose.textContent = "×";
      dialogClose.addEventListener("click", () => subjectDialog.close());
      dialogHead.append(dialogHeading, dialogClose);
      const dialogGrid = document.createElement("div");
      dialogGrid.className = "category-dialog-grid";
      dialogShell.append(dialogHead, dialogGrid);
      subjectDialog.append(dialogShell);
      subjectDialog.addEventListener("click", (event) => {
        if (event.target === subjectDialog) subjectDialog.close();
      });
      section.append(subjectDialog);

      function openCategoryDetails(category) {
        dialogTitle.textContent = category.name;
        const totalHours = summaries.reduce((sum, summary) => sum + (summary.groups.get(category.key)?.hours || 0), 0);
        dialogDescription.textContent = "Все дисциплины этой категории в выбранных учебных планах · " + formatMetric(totalHours) + " суммарно.";
        dialogGrid.replaceChildren();
        for (const summary of summaries) {
          const program = summary.program;
          const items = itemsFor(summary, category.key).slice().sort((a, b) => {
            const semesterA = numberOrNull(semesterKey(a));
            const semesterB = numberOrNull(semesterKey(b));
            if (semesterA === null && semesterB !== null) return 1;
            if (semesterB === null && semesterA !== null) return -1;
            return (semesterA ?? 0) - (semesterB ?? 0) || courseName(a).localeCompare(courseName(b), "ru");
          });
          const column = document.createElement("article");
          column.className = "category-dialog-column";
          column.style.setProperty("--category-color", category.color);
          const columnHead = document.createElement("header");
          columnHead.className = "category-dialog-column-head";
          addText(columnHead, "span", "category-dialog-direction-code", Andromeda.text(program.direction_code) || "Направление");
          addText(columnHead, "h3", "category-dialog-direction", Andromeda.text(program.direction) || "Название направления не указано");
          addText(columnHead, "p", "category-dialog-program", [program.code, program.name].filter(Boolean).join(" · "));
          const hours = sumMetric(items, "hours");
          addText(columnHead, "span", "category-dialog-total", formatMetric(hours.value) + " · " + items.length + " " + Andromeda.numberPlural(items.length, ["дисциплина", "дисциплины", "дисциплин"]));
          column.append(columnHead);
          if (!items.length) {
            addText(column, "p", "category-dialog-empty", "В этом учебном плане предметов такой категории нет.");
          } else {
            const subjectList = document.createElement("ul");
            subjectList.className = "category-dialog-subjects";
            for (const item of items) {
              const row = document.createElement("li");
              addText(row, "strong", "category-dialog-subject-name", courseName(item));
              const meta = [];
              meta.push(semesterKey(item) === "unknown" ? "Семестр не указан" : semesterKey(item) + " семестр");
              const itemHours = numberOrNull(item.hours);
              meta.push(itemHours === null ? "часы не указаны" : formatMetric(itemHours));
              if (Andromeda.text(item.assessment_type)) meta.push(Andromeda.text(item.assessment_type));
              addText(row, "span", "category-dialog-subject-meta", meta.join(" · "));
              subjectList.append(row);
            }
            column.append(subjectList);
          }
          dialogGrid.append(column);
        }
        subjectDialog.showModal();
        dialogClose.focus();
      }

      function selectCategory(key) {
        activeCategoryKey = key;
        section.querySelectorAll("[data-category-select]").forEach((node) => {
          const same = node.dataset.categorySelect === key;
          node.classList.toggle("is-active", same);
          node.classList.toggle("is-dimmed", Boolean(key) && !same);
          node.setAttribute("aria-pressed", String(same));
          node.closest(".category-shared-item")?.classList.toggle("is-active", same);
        });
        for (const view of programViews) {
          const summary = view.summary;
          const category = visibleCategories.find((item) => item.key === key);
          const value = category ? categoryValueFor(summary, key) : 0;
          const hasValue = category ? categoryHasMetric(summary, key) : false;
          view.centerValue.textContent = hasValue ? percent(value, totalFor(summary)) : "—";
          view.centerLabel.textContent = !summary.rows.length
            ? missingPlanMessage(summary.plan, "Нет данных о плане")
            : category?.name || "Выберите категорию";
        }
      }
      selectCategory(activeCategoryKey);
      return section;
    }
    function collectCourseMatrix(programs, curriculumMap) {
      const groups = new Map();
      for (const program of programs) {
        const key = programKey(program);
        for (const item of curriculumMap.get(key) || []) {
          const name = courseName(item);
          const normalized = name.toLocaleLowerCase("ru-RU");
          const rowKey = name === "Название не указано"
            ? normalized + ":" + key + ":" + (item.external_key || item.row_no || groups.size)
            : normalized;
          if (!groups.has(rowKey)) groups.set(rowKey, { name, itemsByProgram: new Map() });
          const group = groups.get(rowKey);
          if (!group.itemsByProgram.has(key)) group.itemsByProgram.set(key, []);
          group.itemsByProgram.get(key).push(item);
        }
      }
      const result = [...groups.values()];
      const firstSemester = (entry) => {
        const values = [...entry.itemsByProgram.values()].flat().map(semesterKey).filter((value) => value !== "unknown").map(Number);
        return values.length ? Math.min(...values) : Infinity;
      };
      result.sort((a, b) => firstSemester(a) - firstSemester(b) || a.name.localeCompare(b.name, "ru"));
      return result;
    }

    function createMatrixEntry(item) {
      const box = document.createElement("div");
      box.className = "matrix-course-entry";
      const classification = Andromeda.getSubjectClassification(item);
      if (classification) {
        addText(box, "span", "matrix-category", classification.name);
      } else {
        addText(box, "span", "matrix-category", "Категория не указана");
      }
      const meta = [];
      meta.push(semesterKey(item) === "unknown" ? "Семестр не указан" : semesterKey(item) + " семестр");
      if (numberOrNull(item.credits) !== null) meta.push(Andromeda.formatNumber(item.credits, 1) + " з.е.");
      if (numberOrNull(item.hours) !== null) meta.push(Andromeda.formatNumber(item.hours) + " ч.");
      if (Andromeda.text(item.assessment_type)) meta.push(Andromeda.text(item.assessment_type));
      addText(box, "span", "matrix-course-meta", meta.join(" · "));
      return box;
    }

    function renderCourseMatrix(programs, curriculumMap, plansByProgram) {
      const section = document.createElement("section");
      section.className = "compare-section";
      const entries = collectCourseMatrix(programs, curriculumMap);
      const commonCount = entries.filter((entry) => entry.itemsByProgram.size === programs.length).length;
      const categoryOptions = [...new Set(entries.flatMap((entry) => [...entry.itemsByProgram.values()].flat().map(Andromeda.getSubjectClassification).filter(Boolean).map((item) => item.name)))].sort((a, b) => a.localeCompare(b, "ru"));
      const semesterOptions = sortSemesters(new Set(entries.flatMap((entry) => [...entry.itemsByProgram.values()].flat().map(semesterKey))));

      const heading = document.createElement("div");
      heading.className = "section-heading";
      const copy = document.createElement("div");
      addText(copy, "p", "section-kicker", "Дисциплины");
      addText(copy, "h2", "", "Матрица предметов");
      const intro = addText(copy, "p", "matrix-summary", "");
      intro.textContent = entries.length + " уникальных названий · " + commonCount + " встречаются во всех выбранных программах.";
      heading.append(copy);
      section.append(heading);
      const details = document.createElement("details");
      details.className = "matrix-details";
      addText(details, "summary", "", "Открыть таблицу и фильтры");
      section.append(details);

      const controls = document.createElement("div");
      controls.className = "matrix-controls";
      const searchLabel = document.createElement("label");
      searchLabel.className = "matrix-field";
      addText(searchLabel, "span", "", "Найти дисциплину или категорию");
      const search = document.createElement("input");
      search.className = "filter-input";
      search.type = "search";
      search.id = "courseMatrixSearch";
      search.autocomplete = "off";
      search.placeholder = "Например, алгоритмы";
      searchLabel.append(search);
      controls.append(searchLabel);

      const semesterLabel = document.createElement("label");
      semesterLabel.className = "matrix-field";
      addText(semesterLabel, "span", "", "Семестр");
      const semesterSelect = document.createElement("select");
      semesterSelect.className = "filter-select";
      semesterSelect.id = "courseMatrixSemester";
      semesterSelect.add(new Option("Все семестры", ""));
      for (const value of semesterOptions) semesterSelect.add(new Option(value === "unknown" ? "Семестр не указан" : value + " семестр", value));
      semesterLabel.append(semesterSelect);
      controls.append(semesterLabel);

      const categoryLabel = document.createElement("label");
      categoryLabel.className = "matrix-field";
      addText(categoryLabel, "span", "", "Категория предмета");
      const categorySelect = document.createElement("select");
      categorySelect.className = "filter-select";
      categorySelect.id = "courseMatrixCategory";
      categorySelect.add(new Option("Все категории", ""));
      for (const category of categoryOptions) categorySelect.add(new Option(category, category));
      categoryLabel.append(categorySelect);
      controls.append(categoryLabel);
      details.append(controls);

      const results = document.createElement("p");
      results.className = "matrix-results";
      results.setAttribute("aria-live", "polite");
      results.setAttribute("aria-atomic", "true");
      details.append(results);
      addText(details, "p", "table-scroll-note", "На узком экране таблицу можно прокручивать по горизонтали.");
      const wrap = document.createElement("div");
      wrap.className = "table-wrap";
      const table = document.createElement("table");
      table.className = "data-table matrix-table";
      table.setAttribute("aria-describedby", "courseMatrixHelp");
      const caption = document.createElement("caption");
      caption.className = "sr-only";
      caption.textContent = "Матрица дисциплин по выбранным образовательным программам.";
      table.append(caption);
      const head = document.createElement("thead");
      const headRow = document.createElement("tr");
      const courseHead = addText(headRow, "th", "", "Дисциплина");
      courseHead.scope = "col";
      for (const program of programs) {
        const th = document.createElement("th");
        th.scope = "col";
        addText(th, "span", "matrix-column-code", program.code || "Код не указан");
        addText(th, "span", "matrix-column-name", program.name || "Название не указано");
        headRow.append(th);
      }
      head.append(headRow);
      table.append(head);
      const body = document.createElement("tbody");
      table.append(body);
      wrap.append(table);
      details.append(wrap);
      addText(details, "p", "matrix-footnote", "Совпадение определяется по полному названию предмета. «Не входит в план» показано только для программы с доступным подтверждённым учебным планом.");
      const help = document.createElement("span");
      help.id = "courseMatrixHelp";
      help.className = "sr-only";
      help.textContent = "В каждой ячейке указаны категория предмета, семестр, зачётные единицы, часы и форма контроля, если эти данные есть в архиве.";
      details.append(help);

      function updateRows() {
        const query = search.value.trim().toLocaleLowerCase("ru-RU");
        const selectedSemester = semesterSelect.value;
        const selectedCategory = categorySelect.value;
        const visible = entries.filter((entry) => {
          const items = [...entry.itemsByProgram.values()].flat();
          const corpus = [entry.name, ...items.map((item) => Andromeda.getSubjectClassification(item)?.name || "")].join(" ").toLocaleLowerCase("ru-RU");
          if (query && !corpus.includes(query)) return false;
          if (selectedSemester && !items.some((item) => semesterKey(item) === selectedSemester)) return false;
          if (selectedCategory && !items.some((item) => Andromeda.getSubjectClassification(item)?.name === selectedCategory)) return false;
          return true;
        });
        results.textContent = "Показано " + visible.length + " из " + entries.length + " названий.";
        body.replaceChildren();
        if (!visible.length) {
          const tr = document.createElement("tr");
          const td = addText(tr, "td", "matrix-no-results", "По этим фильтрам дисциплин нет.");
          td.colSpan = programs.length + 1;
          body.append(tr);
          return;
        }
        for (const entry of visible) {
          const tr = document.createElement("tr");
          const th = document.createElement("th");
          th.scope = "row";
          th.className = "matrix-course-title";
          th.textContent = entry.name;
          if (entry.itemsByProgram.size === programs.length) addText(th, "span", "common-course-tag", "Есть во всех");
          tr.append(th);
          for (const program of programs) {
            const key = programKey(program);
            const td = document.createElement("td");
            const items = (entry.itemsByProgram.get(key) || []).slice().sort((a, b) => {
              const aTerm = semesterKey(a), bTerm = semesterKey(b);
              return aTerm === "unknown" ? 1 : bTerm === "unknown" ? -1 : Number(aTerm) - Number(bTerm);
            });
            if (!items.length) {
              const missing = document.createElement("span");
              missing.className = "matrix-missing";
              addText(missing, "span", "matrix-missing-mark", "–");
              const plan = plansByProgram.get(key);
              addText(missing, "span", "", missingPlanMessage(plan, "Не входит в план"));
              td.append(missing);
            } else {
              for (const item of items) td.append(createMatrixEntry(item));
            }
            tr.append(td);
          }
          body.append(tr);
        }
      }
      search.addEventListener("input", updateRows);
      semesterSelect.addEventListener("change", updateRows);
      categorySelect.addEventListener("change", updateRows);
      updateRows();
      return section;
    }

    async function loadSubjectTaxonomy(curriculumRows) {
      const classification = curriculumRows
        .map((row) => row.subject_classification || row.subjectClassification)
        .find((value) => value?.taxonomy_key && value?.taxonomy_version);
      const taxonomyKey = classification?.taxonomy_key || "bmstu-subject-domain-16";
      const taxonomyVersion = classification?.taxonomy_version || "v1";
      try {
        const taxonomy = await window.AcademicData.get(
          "/v1/subject-taxonomies/" + encodeURIComponent(taxonomyKey) + "/" + encodeURIComponent(taxonomyVersion)
        );
        return Array.isArray(taxonomy?.categories) ? taxonomy.categories : [];
      } catch {
        if (!window.AcademicData.isDemoMode?.()) return [];
        try {
          const response = await fetch("data/prof-test-profiles.json", { cache: "no-cache" });
          if (!response.ok) return [];
          const snapshot = await response.json();
          return snapshot.taxonomy?.taxonomy_key === taxonomyKey
            && snapshot.taxonomy?.taxonomy_version === taxonomyVersion
            && Array.isArray(snapshot.taxonomy.categories)
            ? snapshot.taxonomy.categories
            : [];
        } catch {
          return [];
        }
      }
    }

    async function render() {
      const renderId = ++compareRenderId;
      const selected = Andromeda.getComparison();
      selectedCount.textContent = selected.length + " / 3";
      if (!selected.length) {
        renderEmpty("В каталоге отметь до трёх профилей кнопкой «Сравнить». Выбор сохранится в этом браузере.");
        return;
      }
      root.setAttribute("aria-busy", "true");
      try {
        const programResult = await Andromeda.loadPrograms();
        const allPrograms = programResult.data;
        const programs = selected.map((key) => allPrograms.find((program) => (program.external_key || program.code) === key || program.code === key)).filter(Boolean);
        if (!programs.length) {
          renderEmpty("Сохранённые профили не найдены в текущем снимке базы. Вернись в каталог и выбери программы заново.");
          return;
        }
        const admissionLoading = renderAdmissionLoading();
        const curriculumLoading = document.createElement("section");
        curriculumLoading.className = "compare-section curriculum-loading-note";
        curriculumLoading.setAttribute("role", "status");
        addText(curriculumLoading, "p", "section-kicker", "Учебные планы");
        addText(curriculumLoading, "p", "", "Загружаем планы, чтобы построить круговые диаграммы и сравнить часы по семестрам…");
        root.replaceChildren(
          renderSelectionPicker(programs),
          admissionLoading,
          curriculumLoading,
        );
        root.setAttribute("aria-busy", "false");

        const admissionTask = Andromeda.loadAdmissionForPrograms(programs).then((result) => {
          if (renderId === compareRenderId && admissionLoading.isConnected) {
            admissionLoading.replaceWith(renderAdmissionOverviewTable(programs, result.data || {}));
          }
        }).catch((admissionError) => {
          console.warn("Данные поступления для сравнения недоступны", admissionError);
          if (renderId === compareRenderId && admissionLoading.isConnected) {
            admissionLoading.replaceWith(renderAdmissionError(programs, renderId));
          }
        });

        let curriculumResult = { data: [], plans: [], source: "unavailable" };
        try {
          curriculumResult = await Andromeda.loadCurriculumForPrograms(programs.map(programKey));
        } catch (curriculumError) {
          console.warn("Учебные планы для сравнения недоступны", curriculumError);
        }
        if (renderId !== compareRenderId) return;
        const curriculumMap = new Map(programs.map((program) => [programKey(program), []]));
        const keyByCode = new Map(programs.map((program) => [Andromeda.text(program.code), programKey(program)]));
        for (const row of curriculumResult.data || []) {
          const rowKey = Andromeda.text(row.program_key);
          const key = curriculumMap.has(rowKey) ? rowKey : keyByCode.get(Andromeda.text(row.program_code));
          if (key && curriculumMap.has(key)) curriculumMap.get(key).push(row);
        }

        const plansByProgram = new Map();
        const selectedPlanKeys = new Set(curriculumResult.selectedPlanKeys || []);
        const currentPlanKeys = new Set(curriculumResult.currentPlanKeys || []);
        const ambiguousProgramKeys = new Set(curriculumResult.ambiguousProgramKeys || []);
        const needsReviewProgramKeys = new Set(curriculumResult.needsReviewProgramKeys || []);
        const failedPlanKeys = new Set(curriculumResult.failedPlanKeys || []);
        for (const program of programs) {
          const key = programKey(program);
          const programPlans = (curriculumResult.plans || []).filter((plan) => Andromeda.text(plan.program_key) === key);
          const linkedPlan = programPlans.find((plan) => selectedPlanKeys.has(Andromeda.text(plan.external_key)))
            || programPlans.find((plan) => currentPlanKeys.has(Andromeda.text(plan.external_key)))
            || programPlans.find((plan) => plan.profile_link_status === "verified" && plan.status === "parsed")
            || programPlans.find((plan) => plan.profile_link_status === "verified");
          const planUnavailable = linkedPlan && failedPlanKeys.has(Andromeda.text(linkedPlan.external_key));
          plansByProgram.set(key, {
            profileLinkStatus: ambiguousProgramKeys.has(key) ? "verified" : linkedPlan?.profile_link_status || (programPlans.length ? "unverified" : "unavailable"),
            status: ambiguousProgramKeys.has(key) ? "version-ambiguous" : needsReviewProgramKeys.has(key) ? "current-needs-review" : planUnavailable ? "items-unavailable" : linkedPlan?.status || (programPlans.length
              ? "unverified"
              : ["snapshot", "mixed", "unavailable"].includes(curriculumResult.source) && curriculumMap.get(key).length
                ? "parsed"
                : "unavailable"),
          });
        }
        const taxonomy = await loadSubjectTaxonomy(curriculumResult.data || []);
        if (renderId !== compareRenderId) return;
        curriculumLoading.remove();
        const stats = programs.map((program) => buildSemesterStats(curriculumMap.get(programKey(program)) || []));
        root.append(
          renderWorkloadChart(programs, stats),
          renderCategoryTable(programs, curriculumMap, plansByProgram, taxonomy),
          renderCourseMatrix(programs, curriculumMap, plansByProgram),
        );
        await admissionTask;
      } catch (caughtError) {
        if (renderId !== compareRenderId) return;
        console.error("Не удалось построить сравнение программ", caughtError);
        root.replaceChildren();
        const error = document.createElement("div");
        error.className = "error-banner";
        error.textContent = "Не удалось подготовить сравнение. Обнови страницу или выбери программы заново.";
        root.append(error);
        root.setAttribute("aria-busy", "false");
      }
    }
    render();
  </script>
</body>
</html>
