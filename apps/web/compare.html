<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="icon" href="assets/andromeda-symbol.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Сравнение программ — Andromeda × BMSTU</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="assets/andromeda-header.css">
  <script src="assets/andromeda-header.js" defer></script>
  <style>
    .compare-intro { grid-template-columns: minmax(0, 1fr) minmax(190px, 250px); }
    .compare-intro { padding-top: clamp(34px, 5vw, 68px); padding-bottom: clamp(26px, 3.5vw, 46px); }
    .compare-intro .app-title { max-width: 900px; font-size: clamp(46px, 6.5vw, 82px); line-height: .94; }
    .compare-count { padding: 18px 20px; border: 1px solid var(--line); border-radius: 18px; background: var(--soft); }
    .compare-count strong { display: block; font-size: clamp(25px, 4vw, 40px); font-weight: 500; letter-spacing: -.07em; font-variant-numeric: tabular-nums; }
    .compare-count span { color: var(--muted); font-size: 11px; }

    .compare-section { margin-top: clamp(38px, 6vw, 68px); }
    .compare-section .section-heading { margin-top: 0; }
    .compare-heading-actions { display: flex; align-items: center; gap: 12px; }
    .table-scroll-note { margin: 0 0 9px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .comparison-table { min-width: 940px; table-layout: fixed; }
    .comparison-table th:first-child, .comparison-table td:first-child { position: sticky; left: 0; width: 172px; min-width: 172px; z-index: 2; background: #fff; }
    .comparison-table thead th { position: sticky; top: 0; z-index: 5; min-width: 250px; vertical-align: top; background: #f8f9fb; letter-spacing: normal; text-transform: none; }
    .comparison-table thead th:first-child { z-index: 6; background: #f8f9fb; }
    .comparison-table tbody th:first-child { background: #f8f9fb; font-size: 11px; font-weight: 600; letter-spacing: normal; text-transform: none; }
    .comparison-table td { min-width: 250px; }
    .program-head { display: block; min-height: 95px; }
    .program-head-copy { min-width: 0; }
    .program-head-code { display: block; margin-bottom: 8px; color: var(--blue); font-size: 11px; font-weight: 650; line-height: 1.3; }
    .program-head-name { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.25; letter-spacing: -.025em; overflow-wrap: anywhere; }
    .comparison-source-link { display: inline-flex; align-items: center; gap: 6px; color: var(--blue); font-size: 11px; font-weight: 600; text-decoration: none; }
    .comparison-source-link:hover { text-decoration: underline; text-underline-offset: 3px; }
    .overview-value { display: grid; gap: 4px; }

    .overview-value span { color: var(--muted); font-size: 11px; line-height: 1.45; }
    .comparison-table .overview-value strong { overflow-wrap: anywhere; }
    .comparison-table .overview-value .comparison-source-link { width: fit-content; margin-top: 3px; }

    .workload-panel { overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: #fff; }
    .workload-panel-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 20px 22px; border-bottom: 1px solid var(--line); }
    .workload-panel-head p { max-width: 620px; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .workload-panel-head strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: 14px; font-weight: 600; }
    .workload-switch { display: inline-flex; flex: 0 0 auto; gap: 3px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: #f8f9fb; }
    .workload-switch button { min-height: 36px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-size: 11px; font-weight: 600; cursor: pointer; }
    .workload-switch button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(15, 31, 50, .12); }
    .workload-legend { display: flex; flex-wrap: wrap; gap: 10px 20px; padding: 14px 22px 0; }
    .workload-legend-item { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; line-height: 1.35; }
    .workload-legend-item strong { color: var(--ink); font-weight: 600; }
    .workload-dot { width: 9px; height: 9px; flex: 0 0 auto; border-radius: 3px; background: var(--series-color); }
    .workload-chart { display: grid; gap: 0; padding: 14px 22px 20px; }
    .workload-row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 11px; padding: 15px 0; border-top: 1px solid rgba(17, 17, 17, .09); }
    .workload-row:first-child { border-top: 0; }
    .workload-term { color: var(--ink); font-size: 12px; font-weight: 600; line-height: 1.4; }
    .workload-series-grid { display: grid; grid-template-columns: repeat(var(--series-count, 3), minmax(0, 1fr)); gap: 14px; }
    .workload-series { display: grid; grid-template-columns: minmax(64px, .38fr) minmax(52px, 1fr) auto; align-items: center; gap: 9px; min-width: 0; }
    .workload-code { color: var(--muted); font-size: 10px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
    .workload-track { height: 8px; overflow: hidden; border-radius: 999px; background: #edf0f4; }
    .workload-fill { display: block; width: var(--bar-width, 0%); height: 100%; border-radius: inherit; background: var(--series-color); transition: width .25s ease; }
    .workload-value { min-width: 54px; color: var(--ink); font-size: 11px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
    .workload-empty-value { color: var(--muted); font-size: 10px; }
    .workload-empty { grid-column: 1 / -1; padding: 20px; color: var(--muted); font-size: 12px; text-align: center; }
    .category-program-head { display: grid; gap: 4px; }
    .category-program-code { color: var(--blue); font-size: 11px; font-weight: 650; }
    .category-program-name { color: var(--muted); font-size: 10px; font-weight: 500; line-height: 1.4; }
    .category-comparison-board { overflow: hidden; border: 1px solid var(--line); border-radius: 22px; background: #fff; }
    .category-board-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 22px; border-bottom: 1px solid var(--line); }
    .category-board-title { margin: 8px 0 0; font-size: clamp(23px, 3vw, 34px); font-weight: 500; line-height: 1.05; letter-spacing: -.055em; }
    .category-board-copy { max-width: 620px; margin: 9px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .category-count-tag { display: inline-flex; align-items: center; min-height: 25px; margin-top: 12px; padding: 0 9px; border: 1px solid rgba(0, 108, 220, .22); border-radius: 7px; background: #f4f8ff; color: var(--blue); font-size: 10px; font-weight: 650; }
    .category-board-total { text-align: right; }
    .category-board-total strong { display: block; font-size: 21px; font-weight: 550; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
    .category-board-total span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .category-program-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 1px; background: var(--line); }
    .category-program-card { min-width: 0; padding: 20px; background: #fff; }
    .category-program-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; min-height: 74px; padding-left: 12px; border-left: 3px solid var(--program-color); }
    .category-program-copy { min-width: 0; }
    .category-program-code { display: block; margin-bottom: 5px; color: var(--program-color); font-size: 10px; font-weight: 700; }
    .category-program-name { margin: 0; font-size: 12px; font-weight: 600; line-height: 1.35; letter-spacing: -.015em; }
    .category-program-total { flex: 0 0 auto; text-align: right; }
    .category-program-total strong { display: block; font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .category-program-total span { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; line-height: 1.35; }
    .category-chart-layout { display: grid; place-items: center; margin-top: 10px; }
    .category-interactive-donut-wrap { position: relative; width: min(100%, 210px); margin-inline: auto; aspect-ratio: 1; }
    .category-interactive-donut { display: block; width: 100%; height: 100%; overflow: visible; }
    .category-donut-track { fill: none; stroke: #edf0f4; stroke-width: 24; }
    .category-donut-segment { fill: none; stroke: var(--category-color); stroke-width: 24; stroke-linecap: butt; cursor: pointer; outline: none; transition: opacity .18s ease, stroke-width .18s ease, filter .18s ease; }
    .category-donut-segment:hover, .category-donut-segment:focus-visible, .category-donut-segment.is-active { stroke-width: 29; filter: saturate(1.08); }
    .category-donut-segment.is-dimmed { opacity: .25; }
    .category-donut-segment:focus-visible { filter: drop-shadow(0 0 3px rgba(0, 108, 220, .8)); }
    .category-donut-center { position: absolute; inset: 14%; display: grid; align-content: center; justify-items: center; text-align: center; pointer-events: none; }
    .category-donut-center strong { max-width: 100%; color: var(--ink); font-size: clamp(22px, 3vw, 31px); font-weight: 550; line-height: 1; letter-spacing: -.055em; font-variant-numeric: tabular-nums; }
    .category-donut-center span { max-width: 92px; margin-top: 6px; color: var(--muted); font-size: 9px; line-height: 1.25; }
    .category-program-footnote { margin: 12px 0 0; color: var(--muted); font-size: 9px; line-height: 1.45; }
    .category-subject-dialog { width: min(1120px, calc(100vw - 32px)); max-width: none; max-height: min(90svh, 920px); padding: 0; overflow: hidden; border: 1px solid rgba(17, 17, 17, .12); border-radius: 22px; color: var(--ink); background: #fff; box-shadow: 0 30px 100px rgba(18, 33, 55, .26); }
    .category-subject-dialog::backdrop { background: rgba(15, 25, 40, .48); backdrop-filter: blur(5px); }
    .category-dialog-shell { display: grid; grid-template-rows: auto minmax(0, 1fr); max-height: min(90svh, 920px); }
    .category-dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding: 24px 28px; border-bottom: 1px solid var(--line); background: rgba(255, 255, 255, .98); }
    .category-dialog-title { margin: 7px 0 0; font-size: clamp(24px, 4vw, 36px); font-weight: 550; line-height: 1.05; letter-spacing: -.05em; }
    .category-dialog-description { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .category-dialog-close { display: grid; place-items: center; width: 40px; height: 40px; flex: 0 0 auto; border: 1px solid var(--line); border-radius: 50%; background: #fff; color: var(--muted); font-size: 24px; line-height: 1; cursor: pointer; }
    .category-dialog-close:hover { border-color: var(--ink); color: var(--ink); }
    .category-dialog-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; gap: 12px; overflow: auto; padding: 20px 24px 24px; }
    .category-dialog-column { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 15px; background: #fff; }
    .category-dialog-column-head { padding: 16px; border-top: 3px solid var(--category-color); background: #f8f9fb; }
    .category-dialog-direction-code { display: block; color: var(--blue); font-size: 10px; font-weight: 700; letter-spacing: .04em; }
    .category-dialog-direction { margin: 7px 0 0; font-size: 16px; font-weight: 650; line-height: 1.25; letter-spacing: -.025em; }
    .category-dialog-program { margin: 8px 0 0; color: var(--muted); font-size: 10px; line-height: 1.45; }
    .category-dialog-total { display: block; margin-top: 12px; color: var(--ink); font-size: 11px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .category-dialog-subjects { display: grid; gap: 0; margin: 0; padding: 4px 16px 10px; list-style: none; }
    .category-dialog-subjects li { min-width: 0; padding: 11px 0; border-bottom: 1px solid rgba(17, 17, 17, .08); }
    .category-dialog-subjects li:last-child { border-bottom: 0; }
    .category-dialog-subject-name { display: block; font-size: 11px; font-weight: 570; line-height: 1.4; overflow-wrap: anywhere; }
    .category-dialog-subject-meta { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; line-height: 1.4; }
    .category-dialog-empty { margin: 0; padding: 16px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .category-shared-section { padding: 20px 22px 22px; border-top: 1px solid var(--line); }
    .category-shared-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; }
    .category-shared-title { margin: 7px 0 0; font-size: 21px; font-weight: 550; letter-spacing: -.045em; }
    .category-shared-copy { margin: 6px 0 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .category-reset { min-height: 35px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--muted); font-size: 10px; font-weight: 600; cursor: pointer; transition: border-color .18s ease, color .18s ease, background .18s ease; }
    .category-reset:hover { border-color: var(--ink); color: var(--ink); }
    .category-shared-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 8px; margin-top: 15px; }
    .category-shared-item { display: flex; flex-direction: column; align-items: stretch; min-width: 0; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: #fff; transition: border-color .18s ease, box-shadow .18s ease, background .18s ease, transform .18s ease; }
    .category-shared-item:hover { transform: translateY(-1px); border-color: var(--category-color); }
    .category-shared-item.is-active { border-color: var(--category-color); box-shadow: inset 0 0 0 1px var(--category-color); background: color-mix(in srgb, var(--category-color) 4%, white); }
    .category-shared-select { display: grid; grid-template-columns: 11px minmax(0, 1fr); grid-template-areas: "dot name" "dot values"; column-gap: 9px; align-content: start; width: 100%; min-width: 0; padding: 2px; border: 0; border-radius: 7px; background: transparent; color: inherit; text-align: left; cursor: pointer; }
    .category-shared-select.is-dimmed { opacity: .48; }
    .category-shared-dot { grid-area: dot; width: 11px; height: 11px; margin-top: 2px; border-radius: 50%; background: var(--category-color); }
    .category-shared-name { grid-area: name; min-width: 0; font-size: 11px; font-weight: 650; line-height: 1.35; }
    .category-shared-values { grid-area: values; display: grid; gap: 3px; margin-top: 7px; color: var(--muted); font-size: 9px; line-height: 1.35; }
    .category-shared-values strong { color: var(--ink); font-weight: 600; }
    .category-details-trigger { align-self: flex-start; min-height: 29px; margin: 8px 0 0 20px; padding: 0 10px; border: 1px solid rgba(0, 108, 220, .2); border-radius: 999px; background: #f6f9ff; color: var(--blue); font-size: 10px; font-weight: 650; cursor: pointer; transition: background .18s ease, border-color .18s ease; }
    .category-details-trigger:hover { border-color: var(--blue); background: #edf5ff; }
    .category-distribution { padding: 20px 22px 22px; border-top: 1px solid var(--line); }
    .category-distribution-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 13px; }
    .category-distribution-heading h3 { margin: 6px 0 0; font-size: 20px; font-weight: 550; letter-spacing: -.045em; }
    .category-distribution-note { max-width: 470px; margin: 0; color: var(--muted); font-size: 10px; line-height: 1.45; }
    .category-distribution-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 14px; }
    .category-distribution-table { min-width: 700px; table-layout: fixed; }
    .category-distribution-table th:first-child, .category-distribution-table td:first-child { position: sticky; left: 0; z-index: 2; width: 215px; min-width: 215px; background: #fff; }
    .category-distribution-table thead th { position: sticky; top: 0; z-index: 5; min-width: 175px; background: #f8f9fb; vertical-align: top; letter-spacing: normal; text-transform: none; }
    .category-distribution-table thead th:first-child { z-index: 6; background: #f8f9fb; }
    .category-distribution-table tbody th:first-child { background: #f8f9fb; font-size: 10px; font-weight: 600; letter-spacing: normal; text-transform: none; }
    .category-distribution-table td { min-width: 175px; }
    .category-row-name { display: flex; align-items: flex-start; gap: 8px; line-height: 1.4; }
    .category-row-dot { width: 8px; height: 8px; flex: 0 0 auto; margin-top: 3px; border-radius: 50%; background: var(--category-color); }
    .category-distribution-cell { display: grid; gap: 6px; }
    .category-distribution-values { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; }
    .category-distribution-values strong { color: var(--ink); font-size: 11px; font-weight: 650; }
    .category-distribution-values span { color: var(--muted); font-size: 9px; white-space: nowrap; }
    .category-distribution-track { height: 6px; overflow: hidden; border-radius: 999px; background: #edf0f4; }
    .category-distribution-fill { display: block; width: var(--bar-width, 0%); height: 100%; border-radius: inherit; background: var(--category-color); transition: width .25s ease; }
    .category-distribution-empty { color: var(--muted); font-size: 10px; }
    .compare-selection { margin-bottom: clamp(25px, 4vw, 42px); padding: 18px; border: 1px solid var(--line); border-radius: 18px; background: #fff; }
    .compare-selection-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 12px; }
    .compare-selection-head h2 { margin: 0; font-size: 17px; font-weight: 550; letter-spacing: -.03em; }
    .compare-selection-count { margin: 5px 0 0; color: var(--muted); font-size: 10px; }
    .compare-selection-actions { display: flex; align-items: center; gap: 8px; }
    .compare-selection-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 8px; }
    .compare-selection-card { display: grid; grid-template-columns: minmax(0, 1fr) 34px; align-items: start; gap: 10px; min-width: 0; padding: 12px; border: 1px solid rgba(0, 108, 220, .22); border-radius: 12px; background: #f7faff; }
    .compare-selection-copy { min-width: 0; }
    .compare-selection-copy span { display: block; margin-bottom: 5px; color: var(--blue); font-size: 10px; font-weight: 700; }
    .compare-selection-copy strong { display: -webkit-box; overflow: hidden; font-size: 11px; font-weight: 600; line-height: 1.4; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .compare-selection-remove { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 50%; background: #fff; color: var(--muted); font-size: 17px; cursor: pointer; transition: border-color .18s ease, color .18s ease, background .18s ease; }
    .compare-selection-remove:hover { border-color: #a72b2b; background: #fff8f7; color: #a72b2b; }
    .compare-selection-empty { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .workload-details, .matrix-details { overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: #fff; }
    .workload-details > summary, .matrix-details > summary { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 15px 18px; color: var(--ink); font-size: 12px; font-weight: 600; cursor: pointer; list-style: none; }
    .workload-details > summary::-webkit-details-marker, .matrix-details > summary::-webkit-details-marker { display: none; }
    .workload-details > summary::after, .matrix-details > summary::after { color: var(--blue); content: \"+\"; font-size: 18px; font-weight: 400; line-height: 1; }
    .workload-details[open] > summary, .matrix-details[open] > summary { border-bottom: 1px solid var(--line); }

    .workload-details > .workload-panel { border: 0; border-radius: 0; }
    .matrix-details { padding: 0 14px 14px; }
    .matrix-details > summary { margin: 0 -14px 14px; }
    .matrix-details[open] > summary { margin-bottom: 14px; }

    .matrix-intro { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 0 0 16px; }
    .matrix-summary { margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }

    .matrix-field { display: grid; align-content: start; gap: 7px; min-width: 0; color: var(--muted); font-size: 11px; font-weight: 600; }
    .matrix-field .filter-input, .matrix-field .filter-select { min-height: 44px; font-size: 12px; }
    .matrix-results { min-height: 20px; margin: 0 0 9px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .matrix-table { min-width: 980px; table-layout: fixed; }
    .matrix-table th:first-child, .matrix-table td:first-child { position: sticky; left: 0; z-index: 2; width: 245px; min-width: 245px; background: #fff; }
    .matrix-table thead th { position: sticky; top: 0; z-index: 5; min-width: 230px; background: #f8f9fb; vertical-align: top; letter-spacing: normal; text-transform: none; }
    .matrix-table thead th:first-child { z-index: 6; background: #f8f9fb; }
    .matrix-table td { min-width: 230px; }
    .matrix-column-code { display: block; margin-bottom: 5px; color: var(--blue); font-size: 11px; font-weight: 650; }
    .matrix-column-name { display: block; color: var(--ink); font-size: 11px; font-weight: 600; line-height: 1.35; }
    .matrix-course-title { font-size: 12px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
    .common-course-tag { display: inline-flex; align-items: center; margin-top: 7px; padding: 3px 7px; border-radius: 999px; background: #edf5ff; color: var(--blue); font-size: 10px; font-weight: 600; line-height: 1.2; }
    .matrix-course-entry { display: grid; gap: 6px; padding: 10px; border: 1px solid rgba(17, 17, 17, .1); border-radius: 10px; background: #fff; }
    .matrix-course-entry + .matrix-course-entry { margin-top: 7px; }
    .matrix-course-meta { display: flex; flex-wrap: wrap; gap: 5px 9px; color: var(--muted); font-size: 10px; line-height: 1.35; }
    .matrix-category { display: inline-flex; max-width: 100%; padding: 3px 7px; border-radius: 6px; background: #f0f5fb; color: #425870; font-size: 10px; line-height: 1.35; overflow-wrap: anywhere; }

      .workload-panel-head { align-items: flex-start; flex-direction: column; gap: 14px; }

      .comparison-table thead th, .comparison-table td { min-width: 220px; }
      .category-program-grid { grid-template-columns: 1fr; }
      .category-program-card { padding: 16px; }
      .category-interactive-donut-wrap { width: min(100%, 150px); }

      .workload-chart { padding-inline: 16px; }
      .workload-legend { padding-inline: 16px; }

      .workload-value { min-width: 48px; }
      .category-dialog-head { padding: 18px; }
      .category-dialog-grid { grid-template-columns: 1fr; gap: 9px; padding: 13px; }
      .category-dialog-column-head { padding: 13px; }

    }
    @media (max-width: 380px) {
      .category-interactive-donut-wrap { width: 150px; }
    }
    @media (prefers-reduced-motion: reduce) {

</head>
<body class="has-andromeda-header">
<main class="app-main">
    <section class="app-intro compare-intro">
    <div><h1 class="app-title">Сравни программы</h1><p class="app-description">Места, проходные баллы и условия поступления — рядом. Сопоставь бюджетные и платные места и историю зачисления.</p></div>
      <div class="compare-count"><strong id="selectedCount">0 / 3</strong><span>программ выбрано</span></div>
    </section>
    <div id="compareContent" aria-live="polite" aria-busy="true"><div class="loading-state"><h2>Готовим сравнение</h2><p>Загружаем места и условия поступления.</p></div></div>
  </main>
  <script src="assets/academic-data.js"></script>
  <script src="app.js"></script>
  <script>
    const root = document.getElementById("compareContent");
    const selectedCount = document.getElementById("selectedCount");
    const SERIES_COLORS = ["#006cdc", "#26364a", "#68798e"];
    const CATEGORY_COLORS = ["#006cdc", "#497b5f", "#b77b2f", "#8165a7", "#b75b64", "#3f8190", "#65738b", "#789546", "#bc6a37", "#4f68a6", "#a24f89", "#7a8b41", "#527b9f", "#b17d5c", "#77708f", "#467a70"];
    const selectedMetric = { key: "credits" };
    const UNCLASSIFIED_CATEGORY_KEY = "__unclassified__";
    let activeCategoryKey = null;
    let compareRenderId = 0;

    const addText = (parent, tag, className, value) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      node.textContent = value;
      parent.append(node);
      return node;
    };
    const numberOrNull = (value) => {
      if (value === null || value === undefined || value === "") return null;
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : null;
    };
    function sumMetric(rows, field) {
      let value = 0;
      let count = 0;
      for (const row of rows || []) {
        const metric = numberOrNull(row?.[field]);
        if (metric === null) continue;
        value += metric;
        count += 1;
      }
      return { value, count };
    }
    const programKey = (program) => program.external_key || program.code;

    function missingPlanMessage(plan, fallback) {
      if (!plan) return "Нет данных о плане";
      if (plan.status === "items-unavailable") return "Состав учебного плана не удалось загрузить";
      if (plan.status === "version-ambiguous") return "Найдено несколько версий учебного плана; состав не сопоставлен";
      if (plan.status === "current-needs-review") {
        return plan.profileLinkStatus !== "verified"
          ? "Актуальная версия учебного плана не подтверждена; состав не используется"
          : "Состав учебного плана требует проверки";
      }
      if (plan.profileLinkStatus !== "verified") return "Связь плана не подтверждена";
      if (plan.status === "unverified") return "Состав учебного плана требует проверки";
      if (plan.status === "unavailable") return "План недоступен";
      return fallback;
    }
    const courseName = (item) => Andromeda.text(item.discipline) || Andromeda.text(item.course) || "Название не указано";
    const semesterKey = (item) => Andromeda.text(item.semester) || "unknown";
    function sortSemesters(values) {
      return [...values].sort((a, b) => a === "unknown" ? 1 : b === "unknown" ? -1 : Number(a) - Number(b));
    }

    function renderEmpty(message) {
      root.replaceChildren();
      const empty = document.createElement("section");
      empty.className = "empty-state";
      addText(empty, "h2", "", "Добавь программы для сравнения");
      addText(empty, "p", "", message);
      const link = document.createElement("a");
      link.className = "button button-blue";
      link.href = "programs.html";
      link.textContent = "Открыть каталог";
      link.style.marginTop = "20px";
      empty.append(link);
      root.append(empty);
      root.setAttribute("aria-busy", "false");
    }

    function renderSelectionPicker(programs) {
      const section = document.createElement("section");
      section.className = "compare-selection";
      section.setAttribute("aria-labelledby", "compare-selection-title");
      const head = document.createElement("div");
      head.className = "compare-selection-head";
      const copy = document.createElement("div");
      addText(copy, "h2", "", "Выбранные программы");
      addText(copy, "p", "compare-selection-count", Andromeda.getComparison().length + " из 3 можно сравнить одновременно");
      head.append(copy);
      const actions = document.createElement("div");
      actions.className = "compare-selection-actions";
      const catalog = document.createElement("a");
      catalog.className = "button button-secondary";
      catalog.href = "programs.html";
      catalog.textContent = "Изменить выбор";
      actions.append(catalog);
      head.append(actions);
      section.append(head);
      const list = document.createElement("div");
      list.className = "compare-selection-list";
      const comparison = Andromeda.getComparison();
      programs.forEach((program, index) => {
        const key = comparison.find((value) => value === programKey(program) || value === program.code) || programKey(program);
        const card = document.createElement("article");
        card.className = "compare-selection-card";
        card.style.setProperty("--program-color", SERIES_COLORS[index % SERIES_COLORS.length]);
        const identity = document.createElement("div");
        identity.className = "compare-selection-copy";
        addText(identity, "span", "", program.code || "Код не указан");
        addText(identity, "strong", "", program.name || "Название не указано");
        card.append(identity);
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "compare-selection-remove";
        remove.textContent = "×";
        remove.setAttribute("aria-label", "Убрать программу " + (program.code || program.name) + " из сравнения");
        remove.addEventListener("click", () => {
          Andromeda.setComparison(Andromeda.getComparison().filter((value) => value !== key));
          render();
        });
        card.append(remove);
        list.append(card);
      });
      if (!programs.length) addText(list, "p", "compare-selection-empty", "Добавьте программы в каталоге, чтобы сравнить места и условия поступления.");
      section.append(list);
      return section;
    }

    function buildSemesterStats(rows) {
      const groups = new Map();
      for (const row of rows) {
        const key = semesterKey(row);
        if (!groups.has(key)) groups.set(key, { courses: [], credits: 0, creditsCount: 0, hours: 0, hoursCount: 0 });
        const group = groups.get(key);
        group.courses.push(row);
        const credits = numberOrNull(row.credits);
        const hours = numberOrNull(row.hours);
        if (credits !== null) { group.credits += credits; group.creditsCount += 1; }
        if (hours !== null) { group.hours += hours; group.hoursCount += 1; }
      }
      return groups;
    }

    function appendOverviewValue(cell, value, note, sourceUrl) {
      const wrapper = document.createElement("div");
      wrapper.className = "overview-value";
      addText(wrapper, "strong", "", value);
      if (note) addText(wrapper, "span", "", note);
      const safeSource = Andromeda.safeUrl(sourceUrl);
      if (safeSource) {
        const link = document.createElement("a");
        link.className = "comparison-source-link";
        link.href = safeSource;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Источник ↗";
        wrapper.append(link);
      }
      cell.append(wrapper);
    }

    function matchHistoryDepartment(row, departmentCode) {
      const code = Andromeda.text(row.department_code);
      if (code) return code === departmentCode;
      const labelParts = Andromeda.text(row.scope_label).split(/[^0-9a-zа-я]+/iu);
      return labelParts.includes(departmentCode);
    }

    function conflictingPlaceValues(poolRows) {
      return poolRows.flatMap((pool) => {
        if (numberOrNull(pool.places) !== null) return [];
        const reported = [...new Set((pool.places_by_source_row || [])
          .map((sourceRow) => numberOrNull(sourceRow?.places))
          .filter((value) => value !== null))].sort((a, b) => a - b);
        return reported.length > 1 ? [reported] : [];
      });
    }

    function getAdmissionPlaces(program, admission, fundingType) {
      const directionCode = Andromeda.text(program.direction_code);
      const departmentCode = Andromeda.text(program.department_code);
      const matchingPools = (admission.pools || []).filter((pool) =>
        Andromeda.text(pool.direction_code) === directionCode
        && Andromeda.text(pool.campaign_year) === "2026"
        && pool.funding_type === fundingType
        && pool.quota_type === "general_competition",
      );
      const linkedPools = matchingPools.filter((pool) => (pool.program_keys || []).includes(programKey(program)));
      const departmentPools = departmentCode
        ? matchingPools.filter((pool) => pool.scope_level === "department" && Andromeda.text(pool.department_code) === departmentCode)
        : [];
      const directionPools = matchingPools.filter((pool) => pool.scope_level === "direction" && !Andromeda.text(pool.department_code));
      const unresolvedPools = departmentCode
        ? matchingPools.filter((pool) => pool.scope_level === "offering"
          && Andromeda.text(pool.department_code) === departmentCode
          && (pool.offering_link_statuses || []).includes("manual_review"))
        : [];
      const pools = linkedPools.length ? linkedPools : departmentPools.length ? departmentPools : directionPools;
      const uniquePools = [...new Map(pools.map((pool, index) => [pool.external_key || `${fundingType}-${index}`, pool])).values()];
      const values = uniquePools.map((pool) => numberOrNull(pool.places));
      const knownValues = values.filter((value) => value !== null);
      const unknownCount = values.length - knownValues.length;
      const conflicts = conflictingPlaceValues(uniquePools);
      const places = knownValues.reduce((sum, value) => sum + value, 0);
      const hasCompletePlaces = values.length > 0 && unknownCount === 0;
      const scope = linkedPools.length ? "предложение программы" : departmentPools.length ? "кафедра " + departmentCode : "направление " + directionCode;
      if (!values.length && unresolvedPools.length) {
        return {
          value: "Уточняется",
          note: "Места есть в архиве, но связь предложения с этим профилем ещё проверяется.",
          sourceUrl: unresolvedPools.find((pool) => Andromeda.safeUrl(pool.source_url))?.source_url,
        };
      }
      const value = hasCompletePlaces
        ? Andromeda.formatNumber(places)
        : conflicts.length && !knownValues.length
          ? "Конфликт в источнике"
          : knownValues.length
          ? "Частичные данные"
          : values.length
            ? "Не указано"
            : "Нет данных";
      const conflictValues = [...new Set(conflicts.flat())].sort((a, b) => a - b);
      const note = hasCompletePlaces
        ? "мест · общий конкурс · " + scope + " · 2026"
        : conflicts.length
          ? `Исходные строки содержат разные значения: ${conflictValues.map((value) => Andromeda.formatNumber(value)).join(" и ")}. Полная сумма не подтверждена.`
          : knownValues.length
          ? `Опубликовано ${knownValues.length} из ${values.length} значений мест; полная сумма не подтверждена.`
          : values.length
            ? "Количество мест для выбранного уровня не указано в источнике."
            : "Строка общего конкурса не опубликована для этого уровня.";
      return {
        value,
        note,
        sourceUrl: uniquePools.find((pool) => Andromeda.safeUrl(pool.source_url))?.source_url,
      };
    }

    function getHistoricalAdmissionResult(program, admission) {
      const directionCode = Andromeda.text(program.direction_code);
      const departmentCode = Andromeda.text(program.department_code);
      const history = (admission.history || []).filter((row) =>
        Andromeda.text(row.direction_code) === directionCode
        && row.funding_type === "paid"
        && numberOrNull(row.minimum_score) !== null,
      );
      const departmentHistory = departmentCode
        ? history.filter((row) => row.scope_type === "department" && matchHistoryDepartment(row, departmentCode))
        : [];
      const historyAtSameLevel = departmentHistory.length
        ? departmentHistory
        : history.filter((row) => row.scope_type === "direction");
      const latest = historyAtSameLevel.sort((a, b) =>
        Number(b.admission_year || b.year || 0) - Number(a.admission_year || a.year || 0),
      )[0];
      if (!latest) return { value: "Нет данных", note: "Исторический балл не опубликован для этого направления." };
      const year = Andromeda.text(latest.admission_year || latest.year) || "год не указан";
      const admitted = numberOrNull(latest.admitted_count);
      const scope = departmentHistory.length ? "кафедра " + departmentCode : "направление " + directionCode;
      return {
        value: Andromeda.formatNumber(numberOrNull(latest.minimum_score)) + " баллов",
        note: "платное · минимум зачисленных · " + year + " · " + scope + (admitted === null ? "" : " · зачислено: " + Andromeda.formatNumber(admitted)),
        sourceUrl: latest.source_url,
      };
    }

    function getCampaignAdmissionResult(program, admission, fundingType) {
      const directionCode = Andromeda.text(program.direction_code);
      const results = (admission.campaign_statistics || []).filter((row) =>
        Andromeda.text(row.direction_code) === directionCode
        && row.funding_type === fundingType
        && Andromeda.text(row.admission_year) === "2026"
        && Andromeda.text(row.admission_stage) === "main"
        && ["general", "other"].includes(Andromeda.text(row.competition_type))
        && Andromeda.text(row.status) === "numeric"
        && numberOrNull(row.score ?? row.minimum_score) !== null,
      );
      const latest = results.sort((a, b) =>
        (Date.parse(b.snapshot_date || "") || 0) - (Date.parse(a.snapshot_date || "") || 0),
      )[0];
      if (latest) {
        const score = numberOrNull(latest.score ?? latest.minimum_score);
        const fundingLabel = fundingType === "budget" ? "бюджет · основной конкурс КЦП" : "платное · общий конкурс";
        return {
          value: Andromeda.formatNumber(score) + " баллов",
          note: fundingLabel + " · список зачисленных · 2026",
          sourceUrl: latest.source_url,
        };
      }
      if (fundingType === "paid") return getHistoricalAdmissionResult(program, admission);
      return {
        value: "Нет данных",
        note: "Числовой балл основного бюджетного конкурса не опубликован в доступном снимке базы.",
      };
    }

    function getBudgetQuotaResults(program, admission) {
      const quotaLabels = {
        separate_quota: "Отдельная",
        special_quota: "Особая",
        targeted: "Целевая",
      };
      const rows = (admission.campaign_statistics || []).filter((row) =>
        Andromeda.text(row.direction_code) === Andromeda.text(program.direction_code)
        && row.funding_type === "budget"
        && Andromeda.text(row.admission_year) === "2026"
        && Andromeda.text(row.admission_stage) === "first"
        && quotaLabels[Andromeda.text(row.competition_type)]
        && Andromeda.text(row.status) === "numeric"
        && numberOrNull(row.score ?? row.minimum_score) !== null,
      ).sort((a, b) =>
        (Date.parse(b.snapshot_date || "") || 0) - (Date.parse(a.snapshot_date || "") || 0),
      );
      const scores = new Map();
      for (const row of rows) {
        const type = Andromeda.text(row.competition_type);
        if (!scores.has(type)) scores.set(type, row);
      }
      if (!scores.size) return { value: "Нет данных", note: "Числовые результаты бюджетных квот не опубликованы в доступном снимке базы." };
      const value = [...scores.entries()]
        .map(([type, row]) => quotaLabels[type] + " — " + Andromeda.formatNumber(numberOrNull(row.score ?? row.minimum_score)))
        .join(" · ") + " баллов";
      return {
        value,
        note: "Списки зачисленных 2026 · значения по отдельным квотам, не по общему конкурсу.",
        sourceUrl: rows.find((row) => Andromeda.safeUrl(row.source_url))?.source_url,
      };
    }

    function getExamRequirements(program, admission) {
      const requirements = (admission.requirements || []).filter((row) =>
        Andromeda.text(row.direction_code) === Andromeda.text(program.direction_code),
      );
      const exams = new Map();
      for (const requirement of requirements) {
        for (const exam of requirement.exams || []) {
          const key = [exam.subject_code, exam.minimum_score, Boolean(exam.is_choice)].join("|");
          if (!exams.has(key)) exams.set(key, exam);
        }
      }
      const entries = [...exams.values()];
      if (!entries.length) return { value: "Нет данных", note: "Минимальные баллы не найдены в архиве." };
      const formatExam = (exam) => {
        const minimum = numberOrNull(exam.minimum_score);
        return Andromeda.examLabel(exam.subject_code) + (minimum === null ? " · порог не указан" : " · от " + Andromeda.formatNumber(minimum));
      };
      const mandatory = entries.filter((exam) => !exam.is_choice).map(formatExam);
      const optional = entries.filter((exam) => exam.is_choice).map(formatExam);
      const parts = [];
      if (mandatory.length) parts.push("Обязательные: " + mandatory.join(", "));
      if (optional.length) parts.push("На выбор: " + optional.join(" / "));
      return {
        value: parts.join(" · ") || "Нет данных",
        note: "Минимальные баллы ЕГЭ по условиям 2026; варианты зависят от категории поступающего.",
        sourceUrl: requirements.find((row) => Andromeda.safeUrl(row.source_url))?.source_url,
      };
    }

    function getStudyOffer(program, admission) {
      const programId = programKey(program);
      let offers = (admission.offerings || []).filter((offer) =>
        Andromeda.text(offer.educational_program_key) === programId,
      );
      if (!offers.length && program.direction_code && program.department_code) {
        offers = (admission.offerings || []).filter((offer) =>
          Andromeda.text(offer.direction_code) === Andromeda.text(program.direction_code)
          && Andromeda.text(offer.department_code) === Andromeda.text(program.department_code)
          && offer.catalog_join_status === "exact_code_department_name",
        );
      }
      if (!offers.length) return { value: "Нет точного предложения приёма", note: "Связь с программой не подтверждена." };
      const forms = [...new Set(offers.map((offer) => Andromeda.text(offer.study_form)).filter(Boolean))];
      const durations = [...new Set(offers.map((offer) => Andromeda.text(offer.study_duration_label)).filter(Boolean))];
      return {
        value: forms.join(", ") || "Форма не указана",
        note: durations.length ? "срок обучения · " + durations.join(", ") : "Срок обучения не указан.",
        sourceUrl: offers.find((offer) => Andromeda.safeUrl(offer.source_url))?.source_url,
      };
    }

    function renderAdmissionLoading() {
      const section = document.createElement("section");
      section.className = "compare-section admission-loading-note";
      section.setAttribute("role", "status");
      section.setAttribute("aria-busy", "true");
      addText(section, "h2", "", "Места и проходные баллы");
      addText(section, "p", "", "Загружаем данные приёма для выбранных направлений…");
      return section;
    }

    function renderAdmissionError(programs, renderId) {
      const section = document.createElement("section");
      section.className = "compare-section admission-error-note";
      section.setAttribute("role", "alert");
      addText(section, "h2", "", "Данные поступления временно недоступны");
      addText(section, "p", "", "Сравнение учебных планов остаётся доступным. Попробуйте загрузить данные поступления ещё раз.");
      const retry = document.createElement("button");
      retry.type = "button";
      retry.className = "button button-secondary";
      retry.textContent = "Повторить загрузку";
      retry.addEventListener("click", async () => {
        retry.disabled = true;
        retry.textContent = "Загружаем…";
        try {
          const result = await Andromeda.loadAdmissionForPrograms(programs);
          if (renderId === compareRenderId && section.isConnected) {
            section.replaceWith(renderAdmissionOverviewTable(programs, result.data || {}));
          }
        } catch {
          retry.disabled = false;
          retry.textContent = "Повторить загрузку";
        }
      });
      section.append(retry);
      return section;
    }
