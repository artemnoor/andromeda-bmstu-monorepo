# Keep the API and old hashed assets compatible; redirect page requests to the domain.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/andromeda-preview;
    client_max_body_size 2m;
    location ^~ /.well-known/acme-challenge/ { root /var/www/andromeda-domain-acme; }
    location /api/ {
        add_header X-Robots-Tag "noindex, nosnippet" always;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /insights/track {
        limit_req zone=andromeda_analytics burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:13101/api/track;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /assets/ { try_files $uri =404; }
    location /data/ {
        add_header X-Robots-Tag "noindex, nosnippet" always;
        try_files $uri =404;
    }
    location / { return 301 https://andromedabmstu.ru$request_uri; }
}
