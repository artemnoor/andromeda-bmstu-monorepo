server {
    listen 80;
    server_name andromedabmstu.ru www.andromedabmstu.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/www/andromeda-domain-acme; }
    location / { return 301 https://andromedabmstu.ru$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.andromedabmstu.ru;
    ssl_certificate /etc/letsencrypt/live/andromedabmstu.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/andromedabmstu.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://andromedabmstu.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name andromedabmstu.ru;
    root /var/www/andromeda-preview;
    index index.html;
    client_max_body_size 2m;
    ssl_certificate /etc/letsencrypt/live/andromedabmstu.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/andromedabmstu.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml text/xml application/xml;

    error_page 404 /404/index.html;
    rewrite ^/(programs|compare|discover|feedback)\.html$ https://andromedabmstu.ru/$1 permanent;
    rewrite ^/(programs|discover|compare|feedback)/(index\.html)?$ https://andromedabmstu.ru/$1 permanent;
    rewrite ^/programs/([A-Za-z0-9_.-]+)/(index\.html)?$ https://andromedabmstu.ru/programs/$1 permanent;

    location ^~ /.well-known/acme-challenge/ { root /var/www/andromeda-domain-acme; }
    location = /insights/track {
        limit_req zone=andromeda_analytics burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:13101/api/track;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        add_header X-Robots-Tag "noindex, nosnippet" always;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /openapi.json {
        add_header X-Robots-Tag "noindex, nosnippet" always;
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /index.html { return 301 https://andromedabmstu.ru/$is_args$args; }
    location = /404/index.html {
        internal;
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "no-cache" always;
    }
    location = /__spa-fallback.html { internal; }
    location ~ ^/404(/|$) { return 404; }
    location /data/ {
        add_header X-Robots-Tag "noindex, nosnippet" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~ \.data$ {
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nosnippet" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location / {
        add_header X-Robots-Tag $andromeda_robots always;
        add_header Cache-Control "no-cache" always;
        try_files $uri/index.html $uri =404;
    }
}
