[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "andromeda-bmstu-parsers"
version = "0.1.0"
description = "Offline BMSTU 2026 admission source parsers"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
    "pdfplumber>=0.11,<1",
    "pydantic>=2.7,<3",
    "PyMuPDF>=1.24,<2",
    "pypdf>=3.17,<6",
]

[project.scripts]
andromeda-bmstu = "andromeda_parser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["andromeda_parser*", "andromeda*"]
