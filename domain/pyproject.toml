[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "andromeda-ontology"
version = "0.1.0"
description = "Framework-independent Andromeda ontology and policy semantics"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
include = ["andromeda_ontology*"]
