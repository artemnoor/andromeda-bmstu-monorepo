[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "andromeda-release-bundles"
version = "0.1.0"
description = "Safe, API-independent reading and validation of Andromeda release bundles"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["andromeda_release_bundles*"]
