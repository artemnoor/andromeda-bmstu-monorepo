[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "andromeda-db"
version = "0.1.0"
description = "Andromeda academic data persistence models, repositories, and Alembic history"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "andromeda-ontology",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/andromeda-db/migrations" = ["migrations/env.py", "migrations/script.py.mako"]
"share/andromeda-db/migrations/versions" = ["migrations/versions/*.py"]
