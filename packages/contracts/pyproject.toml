[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "andromeda-contracts"
version = "0.1.0"
description = "Versioned HTTP DTOs and JSON Schema contracts"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["andromeda_contracts*"]
