[tool.uv.workspace]
members = ["domain", "packages/contracts", "packages/db", "services/api", "services/ingestion"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests", "services/api/tests"]
addopts = "-ra"
markers = [
  "integration: requires the dedicated local PostgreSQL test database",
]
pythonpath = ["services/api/src"]

[tool.uv.sources]
andromeda-api = { workspace = true }
andromeda-contracts = { workspace = true }
andromeda-db = { workspace = true }
andromeda-ontology = { workspace = true }
