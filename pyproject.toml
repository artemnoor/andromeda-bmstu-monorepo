[tool.uv.workspace]
members = ["domain", "packages/contracts", "packages/db", "packages/release-bundles", "services/api", "services/ingestion", "services/ingestion-cli"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff==0.16.10"]

[tool.pytest.ini_options]
testpaths = ["tests", "services/api/tests"]
addopts = "-ra"
markers = [
  "integration: requires the dedicated local PostgreSQL test database",
]
pythonpath = ["services/api/src"]

[tool.uv.sources]
andromeda-api = { workspace = true }
andromeda-contracts = { workspace = true }
andromeda-db = { workspace = true }
andromeda-ontology = { workspace = true }
andromeda-release-bundles = { workspace = true }
andromeda-ingestion = { workspace = true }
andromeda-ingestion-cli = { workspace = true }
