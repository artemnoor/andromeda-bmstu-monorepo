services:
  academic-data-db:
    image: postgres:16
    environment:
      POSTGRES_DB: academic_data_test
      POSTGRES_USER: andromeda_test
      POSTGRES_PASSWORD: andromeda_test
    ports:
      - "${ANDROMEDA_DB_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U andromeda_test -d academic_data_test"]
      interval: 2s
      timeout: 3s
      retries: 30
