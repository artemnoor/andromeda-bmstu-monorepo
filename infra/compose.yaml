services:
  academic-data-db:
    image: postgres:16
    environment:
      POSTGRES_DB: academic_data_test
      POSTGRES_USER: andromeda_test
      POSTGRES_PASSWORD: andromeda_test
    ports:
      - "${ANDROMEDA_DB_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U andromeda_test -d academic_data_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  directus:
    image: directus/directus:12.4.1
    profiles: ["directus"]
    ports:
      - "127.0.0.1:${DIRECTUS_PORT:-8055}:8055"
    environment:
      SECRET: ${DIRECTUS_SECRET:?set DIRECTUS_SECRET in the local environment}
      LICENSE_KEY: ${DIRECTUS_LICENSE_KEY:-}
      DB_CLIENT: pg
      DB_HOST: academic-data-db
      DB_PORT: 5432
      DB_DATABASE: academic_data_test
      DB_USER: andromeda_directus_runtime
      DB_PASSWORD: ${ANDROMEDA_DIRECTUS_DB_PASSWORD:?set ANDROMEDA_DIRECTUS_DB_PASSWORD in the local environment}
      DB_SEARCH_PATH: array:directus_meta,directus_read
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:?set DIRECTUS_ADMIN_EMAIL in the local environment}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?set DIRECTUS_ADMIN_PASSWORD in the local environment}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    depends_on:
      academic-data-db:
        condition: service_healthy
